name: TDC0 incidence-derived cycle-code control

on:
  pull_request:
    paths:
      - 'src/morph_kem/tdc_cycle_code.py'
      - 'tests/test_tdc_cycle_code.py'
      - 'scripts/tdc_cycle_code_*.py'
      - 'docs/58-tdc0-incidence-cycle-code.md'
      - '.github/workflows/tdc0.yml'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/tdc_cycle_code.py'
      - 'tests/test_tdc_cycle_code.py'
      - 'scripts/tdc_cycle_code_*.py'
      - 'docs/58-tdc0-incidence-cycle-code.md'
      - '.github/workflows/tdc0.yml'

permissions:
  contents: read

jobs:
  tdc0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile TDC0
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/morph_kem/tdc_cycle_code.py tests/test_tdc_cycle_code.py scripts/tdc_cycle_code_baseline.py scripts/tdc_cycle_code_sweep.py
      - name: TDC0 unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_tdc_cycle_code -v
      - name: TDC0 fixed baseline
        env:
          PYTHONPATH: src
        run: python scripts/tdc_cycle_code_baseline.py --params tdc0-8x8
      - name: TDC0 multi-seed sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/tdc_cycle_code_sweep.py --seeds 8
