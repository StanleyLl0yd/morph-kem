name: HGA4 Hurwitz free-group action control

on:
  pull_request:
    paths:
      - 'src/morph_kem/hga_hurwitz.py'
      - 'tests/test_hga_hurwitz.py'
      - 'scripts/hga_hurwitz_*.py'
      - '.github/workflows/hga4.yml'
      - 'docs/67-hga4-hurwitz-free-group.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/hga_hurwitz.py'
      - 'tests/test_hga_hurwitz.py'
      - 'scripts/hga_hurwitz_*.py'
      - '.github/workflows/hga4.yml'
      - 'docs/67-hga4-hurwitz-free-group.md'

permissions:
  contents: read

jobs:
  hga4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile HGA4
        run: >-
          python -m compileall -q
          src/morph_kem/hga_hurwitz.py
          tests/test_hga_hurwitz.py
          scripts/hga_hurwitz_baseline.py
          scripts/hga_hurwitz_sweep.py
      - name: HGA4 unit tests
        run: python -m unittest tests.test_hga_hurwitz -v
      - name: HGA4 fixed baseline
        if: matrix.python-version == '3.12'
        run: python scripts/hga_hurwitz_baseline.py --params hga4-L16
      - name: HGA4 multi-seed growth sweep
        if: matrix.python-version == '3.12'
        run: python scripts/hga_hurwitz_sweep.py --seeds 8
