name: G18 measurement report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed G18 report
        env:
          PYTHONPATH: src
        run: python scripts/gluing_length_bounded_pair_report.py
