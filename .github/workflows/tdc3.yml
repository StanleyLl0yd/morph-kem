name: TDC3 matched decoder-work control

on:
  pull_request:
    paths:
      - 'src/morph_kem/tdc_decoder_work.py'
      - 'src/morph_kem/tdc_decoder_reliability.py'
      - 'tests/test_tdc_decoder_work.py'
      - 'tests/test_tdc_decoder_reliability.py'
      - 'scripts/tdc_decoder_work_*.py'
      - 'scripts/tdc_decoder_reliability_*.py'
      - '.github/workflows/tdc3.yml'
      - 'docs/87-tdc3-matched-decoder-work.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/tdc_decoder_work.py'
      - 'src/morph_kem/tdc_decoder_reliability.py'
      - 'tests/test_tdc_decoder_work.py'
      - 'tests/test_tdc_decoder_reliability.py'
      - 'scripts/tdc_decoder_work_*.py'
      - 'scripts/tdc_decoder_reliability_*.py'
      - '.github/workflows/tdc3.yml'
      - 'docs/87-tdc3-matched-decoder-work.md'

permissions:
  contents: read

jobs:
  tdc3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile TDC3
        run: >-
          python -m compileall -q
          src/morph_kem/tdc_decoder_work.py
          src/morph_kem/tdc_decoder_reliability.py
          tests/test_tdc_decoder_work.py
          tests/test_tdc_decoder_reliability.py
          scripts/tdc_decoder_work_baseline.py
          scripts/tdc_decoder_work_sweep.py
          scripts/tdc_decoder_reliability_baseline.py
          scripts/tdc_decoder_reliability_sweep.py
      - name: TDC3 unit tests
        run: >-
          python -m unittest
          tests.test_tdc_decoder_work
          tests.test_tdc_decoder_reliability -v
      - name: TDC3 fixed decoder baseline
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_decoder_work_baseline.py --params tdc3-n10
      - name: TDC3 all-size matched decoder sweep
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_decoder_work_sweep.py --seeds 8
      - name: TDC3 fixed reliability baseline
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_decoder_reliability_baseline.py --params tdc3-n10 --pool-size 24
      - name: TDC3 all-size reliability sweep
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_decoder_reliability_sweep.py --seeds 8 --pool-size 24
      - name: TDC3 predeclared n10 reliability extension
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_decoder_reliability_sweep.py --params tdc3-n10 --seeds 32 --pool-size 24
