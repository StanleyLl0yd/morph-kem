name: G4 one-shot API cleanup

on:
  push:
    branches: ['g4/hges-coupled-phase-parity']
    paths: ['.github/workflows/g4-code-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g4/hges-coupled-phase-parity
      - name: Harden G4 public API validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/morph_kem/gluing_coupled.py')
          text = path.read_text()
          text = text.replace(
              'from .gluing import DualEdge, GluingExperimentError, TetrahedronGroup, _normalize_groups',
              'from .gluing import (\n    DualEdge,\n    GluingExperimentError,\n    GluingPublicInstance,\n    TetrahedronGroup,\n    _normalize_groups,\n)'
          )
          text = text.replace('    MatchingGluingReference,\n', '')
          text = text.replace('    gadgets: tuple[object, ...]', '    gadgets: tuple[GluingPublicInstance, ...]')
          text = text.replace('def _canonical_gadget_matchings(gadget: object)', 'def _canonical_gadget_matchings(gadget: GluingPublicInstance)')
          text = text.replace('    recovery = recover_matching_gluing(gadget)  # type: ignore[arg-type]', '    recovery = recover_matching_gluing(gadget)')
          text = text.replace('    gadget: object,\n    groups:', '    gadget: GluingPublicInstance,\n    groups:')
          text = text.replace('        if not validate_matching_gluing_witness(gadget, groups).valid:  # type: ignore[arg-type]', '        if not validate_matching_gluing_witness(gadget, groups).valid:')
          text = text.replace('        total_tetrahedra += len(gadget.tetrahedra)  # type: ignore[attr-defined]', '        total_tetrahedra += len(gadget.tetrahedra)')

          helper_anchor = '    nonreference_accepted_solutions: int\n\n\ndef _canonical_gadget_matchings'
          helper = '''    nonreference_accepted_solutions: int\n\n\ndef _constraint_is_well_formed(\n    variable_count: int,\n    constraint: PhaseConstraint,\n) -> bool:\n    return (\n        constraint.parity in (0, 1)\n        and 0 <= constraint.left < variable_count\n        and 0 <= constraint.right < variable_count\n        and constraint.left != constraint.right\n    )\n\n\ndef _canonical_gadget_matchings'''
          if helper_anchor not in text:
              raise SystemExit('G4 helper anchor missing')
          text = text.replace(helper_anchor, helper, 1)

          old_validation = '''    phase_tuple = tuple(phases)\n    for constraint in public.constraints:\n        if constraint.parity not in (0, 1):\n            return CoupledPhaseValidation(False, "invalid public G4 parity", phase_tuple)\n        if phase_tuple[constraint.left] ^ phase_tuple[constraint.right] != constraint.parity:\n            return CoupledPhaseValidation(False, "G4 coupling constraint violated", phase_tuple)\n'''
          new_validation = '''    phase_tuple = tuple(phases)\n    for constraint in public.constraints:\n        if not _constraint_is_well_formed(len(public.gadgets), constraint):\n            return CoupledPhaseValidation(False, "malformed public G4 constraint", phase_tuple)\n        if phase_tuple[constraint.left] ^ phase_tuple[constraint.right] != constraint.parity:\n            return CoupledPhaseValidation(False, "G4 coupling constraint violated", phase_tuple)\n'''
          if old_validation not in text:
              raise SystemExit('G4 validation anchor missing')
          text = text.replace(old_validation, new_validation, 1)

          old_recovery = '''    variable_count = len(public.gadgets)\n    rank, row_xors, consistent = _gf2_rank_and_work(variable_count, public.constraints)\n'''
          new_recovery = '''    variable_count = len(public.gadgets)\n    if variable_count < 2:\n        raise GluingExperimentError("public G4 instance has too few gadgets")\n    if any(\n        not _constraint_is_well_formed(variable_count, constraint)\n        for constraint in public.constraints\n    ):\n        raise GluingExperimentError("malformed public G4 constraint")\n    rank, row_xors, consistent = _gf2_rank_and_work(variable_count, public.constraints)\n'''
          if old_recovery not in text:
              raise SystemExit('G4 recovery anchor missing')
          text = text.replace(old_recovery, new_recovery, 1)
          path.write_text(text)

          test_path = Path('tests/test_gluing_coupled.py')
          tests = test_path.read_text()
          tests = tests.replace(
              '    CoupledPhaseParameters,\n',
              '    CoupledPhaseParameters,\n    CoupledPhasePublicInstance,\n    PhaseConstraint,\n'
          )
          test_anchor = '''    def test_parameter_and_seed_bounds(self) -> None:\n'''
          test_block = '''    def test_malformed_public_constraint_is_rejected(self) -> None:\n        public, reference = generate_coupled_phase_instance(\n            G4_PARAMETER_SETS["g4-4"], MASTER_SEED\n        )\n        malformed = CoupledPhasePublicInstance(\n            name=public.name,\n            gadgets=public.gadgets,\n            constraints=public.constraints + (PhaseConstraint(0, 99, 1),),\n        )\n        self.assertFalse(\n            validate_coupled_phase_witness(malformed, reference.groups).valid\n        )\n        with self.assertRaises(GluingExperimentError):\n            recover_coupled_phases(malformed)\n\n'''
          if test_block not in tests:
              if test_anchor not in tests:
                  raise SystemExit('G4 test anchor missing')
              tests = tests.replace(test_anchor, test_block + test_anchor, 1)
          test_path.write_text(tests)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/morph_kem/gluing_coupled.py tests/test_gluing_coupled.py
          git diff --cached --quiet && exit 0
          git commit -m 'G4: harden public constraint validation'
          git push origin HEAD:g4/hges-coupled-phase-parity
