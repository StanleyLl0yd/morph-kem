name: G17 one-shot measured-result bookkeeping

on:
  push:
    branches: ['g17/tree-cotree-symplectic-pair']
    paths: ['.github/workflows/g17-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g17/tree-cotree-symplectic-pair
      - name: Record measured G17 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-043 | Public fundamental-cycle cohomology-pairing recovery | **Fatal to G16 generated distribution** | Implemented |'
          row = '| A-044 | Public tree-cotree primal-dual one-crossing recovery | **Fatal to G17 generated distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-043 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          heading = '## A-044 — public tree-cotree primal-dual one-crossing recovery'
          if heading not in text:
              text = text.rstrip() + '''\n\n## A-044 — public tree-cotree primal-dual one-crossing recovery\n\n### Target\n\nG17 is the first explicitly bilinear global HGES relation: the verifier accepts a pair of simple cycles, one in the public primal graph and one in the public triangle-dual graph, when their mod-2 crossing number is odd.\n\n### Public attack\n\nBuild a public primal spanning tree `T`. In the dual graph forbid every edge crossing `T`, then build a public dual spanning tree `T*`. On the torus exactly two primal edges remain outside both structures. For either leftover edge `e`, the primal fundamental cycle of `e` relative to `T` and the dual fundamental cycle of `e*` relative to `T*` cross exactly once: the primal path lies in `T`, while `T*` contains no dual edge crossing `T`.\n\n### Fixed Python 3.12 `g17-8x9` result\n\nThe 72/216/144 carrier has 71 primal-tree edges, 143 dual-cotree edges and exactly two leftovers. The first leftover produces primal/dual cycle lengths 10/24 after 9/23 path-edge scans, exact crossing count one and exact-verifier acceptance. It differs from the second-leftover reference pair.\n\nAn independent full-basis check constructs 145 primal and 73 dual fundamental cycles. Their 145×73 crossing matrix has weight 550, GF(2) rank two and requires 48 row XORs. The first odd entry reached after 230 row-major pair tests gives 8/19-edge cycles with one crossing and passes the verifier.\n\nAcross `g17-6x6`, `g17-6x9`, `g17-8x9` × eight seeds, **24/24** tree-cotree decompositions expose exactly two leftovers, **24/24** primary pairs have exact crossing count one and pass the verifier, and all 24 differ from the reference. Every full-basis matrix has rank two and every independent basis witness is accepted.\n\n### Result\n\n**G17 is rejected by A-044.** The bilinear topological predicate still has a direct public construction supplied by standard tree-cotree decomposition. Increasing dimensions or carrier mixing cannot repair the public intersection-form exposure. G18 must require geometric information not determined by homology intersection and must immediately face disjoint-path/flow/matching, shortest-cycle, ILP/SAT/CP-SAT, separator/treewidth, normalization and equivalent-witness attacks. No security claim.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          log_heading = '## 2026-09-11 — G17 rejected by A-044'
          if log_heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-11 — G17 rejected by A-044\n\nG17 moved beyond G16's single affine cohomology predicate to a bilinear relation between two independently global simple cycles: one primal, one dual, with odd crossing parity.\n\nAttack-first analysis found a stronger break than generic bilinear solving. A public tree-cotree decomposition leaves exactly two edges on every measured torus. The fundamental primal and dual cycles generated by either leftover edge cross exactly once by construction. Fixed `g17-8x9` needs only 9 primal-tree and 23 dual-tree path scans to produce accepted 10/24-edge cycles.\n\nThe independent full-cycle-basis crossing matrix is 145×73 on the fixed baseline, has weight 550 and GF(2) rank exactly two. Across all three sizes × eight seeds, **24/24** primary exact-one-crossing pairs and **24/24** full-basis cross-check pairs pass the exact verifier; all primary witnesses differ from the reference.\n\n**G17 rejected by A-044.** Lesson: bilinear homological intersection is still publicly constructive on an explicitly embedded surface. G18 must impose geometry not fixed by the homology intersection form and face flow/matching/disjoint-path and generic solver attacks immediately. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G16 are implemented and rejected.', 'HGES controls G0–G17 are implemented and rejected.')
          if '## G17 — primal-dual symplectic cycle-pair control' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G17 — primal-dual symplectic cycle-pair control\n\nG17 is the first explicitly bilinear global-witness control. A witness is a simple public primal cycle and a simple public dual cycle with odd mod-2 crossing number.\n\n**G17 is rejected by A-044.** A standard public tree-cotree decomposition leaves exactly two edges on the torus; either leftover edge directly yields primal and dual fundamental cycles with exactly one crossing. Fixed `g17-8x9` constructs a 10/24-edge accepted pair after only 9/23 tree-path scans. Across all three sizes × eight seeds, **24/24** primary pairs have exact crossing count one and pass the verifier. An independent full-basis crossing matrix has GF(2) rank two in every measured instance and also yields accepted witnesses.\n\nSee `docs/52-g17-symplectic-cycle-pair.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/51-g16-cohomology-cycle.md` — measured G16/A-043 nonlocal cohomology-cycle rejection'
          key_row = '- `docs/52-g17-symplectic-cycle-pair.md` — measured G17/A-044 tree-cotree intersection rejection'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README key-file anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G17**, not a trapdoor construction. G16 shows that even a genuinely nonlocal cohomological verifier is trivial when acceptance is affine on a public cycle space.\n\nG17 must therefore leave affine homology/cohomology membership and couple multiple global cycles through a nonlinear geometric condition such as disjointness or intersection. It must immediately face public symplectic homology bases, flow/matching reductions, ILP/SAT/CP-SAT, separator/treewidth and low-width methods, normalization, equivalent-witness enumeration and generated-role leakage.\n\nNo trapdoor/KEM work begins before such a nonlinear global relation survives these attacks.\n'''
          new = '''The next controlled HGES experiment is **G18**, not a trapdoor construction. G17 shows that moving from affine cohomology to a bilinear homology-intersection predicate is still insufficient: public tree-cotree decomposition constructs an accepted exact-one-crossing pair directly.\n\nG18 must therefore require geometric information not determined only by homology classes or their mod-2 intersection form—for example internally vertex-disjoint representatives, constrained-length representatives, or a prescribed geometric-intersection pattern not automatically supplied by tree-cotree. It must immediately face disjoint-path/flow/matching reductions, surface shortest-cycle algorithms, ILP/SAT/CP-SAT, separator/treewidth methods, normalization and equivalent-witness enumeration.\n\nNo trapdoor/KEM work begins before such a geometric global relation survives these attacks.\n'''
          if old not in text:
              raise SystemExit('README G17 next-gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G17: record tree-cotree intersection rejection'
          git push origin HEAD:g17/tree-cotree-symplectic-pair
