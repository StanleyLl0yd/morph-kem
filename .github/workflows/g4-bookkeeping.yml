name: G4 one-shot result bookkeeping

on:
  push:
    branches: ['g4/hges-coupled-phase-parity']
    paths: ['.github/workflows/g4-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g4/hges-coupled-phase-parity
      - name: Record measured G4 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          row = '| A-031 | Public GF(2) coupled-phase synchronization | **Fatal to G4 generated distribution** | Implemented |'
          if row not in text:
              anchor = '| A-030 | Equivalent perfect-matching gluing recovery | **Fatal to G3 generated distribution** | Implemented |'
              if anchor not in text:
                  raise SystemExit('A-030 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          if '## A-031 — public GF(2) coupled-phase synchronization' not in text:
              text = text.rstrip() + '''\n\n## A-031 — public GF(2) coupled-phase synchronization\n\n### Target\n\nG4 coupled-phase HGES negative control.\n\nG4 starts from locally ambiguous `g3-3` gadgets. Each gadget has exactly two accepted public perfect-match decompositions, canonically represented by one phase bit. Generation publishes only pairwise phase differences `b_ij = x_i XOR x_j` on a connected redundant coupling graph.\n\n### Public attack\n\nA-031 uses no hidden reference phases:\n\n1. enumerate and canonically order the two accepted G3 matchings for every gadget;\n2. translate every public coupling edge into one binary linear equation;\n3. recover phases by spanning-tree propagation from an arbitrary root bit;\n4. check every redundant cycle constraint;\n5. independently row-reduce the full public equation system over GF(2);\n6. repeat propagation for both root bits;\n7. lift both public phase vectors to local matching witnesses;\n8. submit both to the exact G4 verifier;\n9. compare to generation history only after public acceptance.\n\n### Exact Python 3.12 `g4-12` result\n\n~~~text\ngadgets:                                  12\ntotal public tetrahedra:                  72\ncoupling vertices / edges:                12/18\ncoupling cycle rank:                       7\nper-gadget perfect matchings:              twelve copies of 2\ntotal local matching nodes/backtracks:    84/0\nXOR equations / variables:                18/12\nGF(2) rank / nullity:                     11/1\nGF(2) row XORs:                           72\npropagation tree assignments:             22\npropagation constraint checks:            36\nrecovered phase solutions:                 2\naccepted public solutions:                 2\naccepted non-reference solutions:          1\nreference witness accepted:               yes\n~~~\n\n### Deterministic sweep\n\nPython 3.12 tested `g4-4`, `g4-8`, and `g4-12` over eight independently derived deterministic seeds each.\n\n| Set | Gadgets | Coupling edges | Cycle rank | Rank/nullity | Row XORs | Local matching nodes/backtracks | Propagation assignments/checks | Accepted | Non-reference |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n| g4-4 | 4 | 6 | 3 | 3/1 | 10 | 28/0 | 6/12 | 2 | 1 |\n| g4-8 | 8 | 12 | 5 | 7/1 | 38 | 56/0 | 14/24 | 2 | 1 |\n| g4-12 | 12 | 18 | 7 | 11/1 | 72 | 84/0 | 22/36 | 2 | 1 |\n\nAll **24/24** generated instances have rank `g-1`, nullity `1`, two accepted public phase assignments, and exactly one accepted assignment different from the hidden reference.\n\n### Result\n\n**G4 is rejected by A-031.**\n\nThe new nonlocal coupling is exactly public binary synchronization/cohomology. Redundant cycles add consistency checks but no secret asymmetry; on a connected graph the only residual freedom is the common global phase flip, which is itself an accepted equivalent witness. Increasing the number of gadgets or coupling edges cannot repair the algebraic collapse.\n\nThis is not a theorem that general HGES is easy. It rejects this generated relation and shows that nonlocality alone is not useful when it factors through an abelian binary quotient.\n\n### G5 gate\n\nA successor must change the constraint algebra, not merely the graph. It must first face quotient/abelianization tests, finite-domain CSP, belief propagation/local consistency, low-width dynamic programming, exact SAT/CP-SAT, automorphism/normalization, equivalent-witness enumeration, and generated-role leakage. No trapdoor work begins from a parity-coupled relation.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          if '### G4 — coupled-phase parity-collapse control' not in text:
              text = text.rstrip() + '''\n\n### G4 — coupled-phase parity-collapse control\n\nCoupled many locally ambiguous `g3-3` gadgets with public pairwise phase differences on redundant connected graphs. Each local gadget still has exactly two accepted matching phases; generation reference phases are not used by the attack.\n\nA-031 independently performs spanning-tree XOR propagation and full GF(2) row reduction. Exact-head Python 3.12 `g4-12` gives 12 gadgets / 72 tetrahedra, 18 coupling constraints, cycle rank 7, rank/nullity 11/1, 72 row XORs, 84/0 local matching nodes/backtracks, and two accepted global phase solutions, one non-reference.\n\nAcross `g4-4`, `g4-8`, `g4-12` × eight seeds, **24/24** instances have rank `g-1`, nullity 1, two accepted solutions and one non-reference solution.\n\n**G4 rejected by A-031.**\n\nLesson: adding nonlocal coupling does not create hardness when the coupling factors exactly through public XOR differences. G5 must change the constraint algebra and immediately face quotient/abelianization, bounded-domain CSP, local consistency/belief propagation, low-width DP, SAT/CP-SAT, normalization and equivalent-witness attacks.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G3 are implemented and rejected.', 'HGES controls G0–G4 are implemented and rejected.')
          if '## G4 — coupled-phase HGES parity-collapse control' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G4 — coupled-phase HGES parity-collapse control\n\nG4 couples the two public matching phases of many G3 gadgets through redundant pairwise XOR constraints. This is the first HGES control with explicit nonlocal coupling.\n\n**G4 is rejected by A-031.** Public spanning-tree phase propagation and independent GF(2) elimination recover both accepted global phase assignments. On `g4-12`, the 18×12 system has rank/nullity `11/1`; the attack uses 72 row XORs and returns two accepted witnesses, one different from the hidden reference.\n\nAcross `g4-4`, `g4-8`, `g4-12` and eight deterministic seeds each, **24/24** instances have rank `g-1`, nullity 1, two accepted public solutions and one non-reference solution. The coupling is therefore binary synchronization/cohomology, not evidence of hardness.\n\nSee `docs/39-g4-coupled-phase-parity.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/38-g3-equivalent-matching.md` — measured G3/A-030 negative control'
          key_row = '- `docs/39-g4-coupled-phase-parity.md` — measured G4/A-031 negative control'
          if key_row not in text and key_anchor in text:
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G4**, not a trapdoor construction. G4 may add genuinely nonlocal coupling between otherwise plausible local decomposition choices, but the coupling itself must be treated as the new public attack surface rather than as assumed hardness.\n\nA first G4 control should deliberately test whether binary local matching phases coupled across multiple gadgets collapse to parity/cycle-space/cohomology or another low-width constraint problem. Before any positive interpretation, G4 must face constrained matching, factor-graph propagation, low-width dynamic programming, exact-cover/CSP/SAT/CP-SAT, automorphism/normalization, equivalent-witness enumeration, and planted-role statistical leakage.\n'''
          new = '''The next controlled HGES experiment is **G5**, not a trapdoor construction. G4 showed that explicit nonlocal coupling is still useless when it factors through public pairwise XOR differences.\n\nG5 must change the constraint algebra rather than increase the coupling graph. Before any positive interpretation it must face quotient/abelianization tests, finite-domain CSP, belief propagation/local consistency, low-width dynamic programming, exact SAT/CP-SAT, automorphism/normalization, equivalent-witness enumeration, and planted-role statistical leakage.\n'''
          if old in text:
              text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G4: record parity-collapse rejection'
          git push origin HEAD:g4/hges-coupled-phase-parity
