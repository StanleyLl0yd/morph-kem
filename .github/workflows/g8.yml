name: G8 HGES topology-to-CSP collapse audit

on:
  pull_request:
    paths:
      - 'src/morph_kem/gluing_phase_csp.py'
      - 'src/morph_kem/gluing_coupled.py'
      - 'src/morph_kem/gluing_exact_one.py'
      - 'src/morph_kem/gluing_residual.py'
      - 'src/morph_kem/gluing_sat.py'
      - 'tests/test_gluing_phase_csp.py'
      - 'scripts/gluing_phase_csp_*.py'
      - 'docs/05-cryptanalysis.md'
      - 'docs/43-g8-topology-csp-collapse.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/g8.yml'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/gluing_phase_csp.py'
      - 'src/morph_kem/gluing_coupled.py'
      - 'src/morph_kem/gluing_exact_one.py'
      - 'src/morph_kem/gluing_residual.py'
      - 'src/morph_kem/gluing_sat.py'
      - 'tests/test_gluing_phase_csp.py'
      - 'scripts/gluing_phase_csp_*.py'
      - 'docs/05-cryptanalysis.md'
      - 'docs/43-g8-topology-csp-collapse.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/g8.yml'

permissions:
  contents: read

jobs:
  g8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile G8
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/morph_kem/gluing_phase_csp.py tests/test_gluing_phase_csp.py scripts/gluing_phase_csp_baseline.py scripts/gluing_phase_csp_equivalence.py scripts/gluing_phase_csp_sweep.py
      - name: G8 unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_gluing_phase_csp -v
      - name: G8 topology-free CSP baseline
        env:
          PYTHONPATH: src
        run: python scripts/gluing_phase_csp_baseline.py
      - name: G8 exhaustive smallest-set semantic equivalence
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/gluing_phase_csp_equivalence.py
      - name: G8 multi-family multi-seed sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/gluing_phase_csp_sweep.py --seeds 4
