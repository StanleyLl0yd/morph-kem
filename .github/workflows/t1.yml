name: T1 distance-conditioned Pachner calibration

on:
  pull_request:
    paths:
      - 'src/morph_kem/pachner.py'
      - 'src/morph_kem/pachner_distance.py'
      - 'tests/test_pachner*.py'
      - 'scripts/pachner_*.py'
      - 'docs/05-cryptanalysis.md'
      - 'docs/34-t1-distance-conditioned-results.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/t1.yml'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/pachner.py'
      - 'src/morph_kem/pachner_distance.py'
      - 'tests/test_pachner*.py'
      - 'scripts/pachner_*.py'
      - 'docs/05-cryptanalysis.md'
      - 'docs/34-t1-distance-conditioned-results.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/t1.yml'

permissions:
  contents: read

jobs:
  t1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile T1
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/morph_kem/pachner.py src/morph_kem/pachner_distance.py tests/test_pachner.py tests/test_pachner_distance.py scripts/pachner_distance_baseline.py scripts/pachner_distance_sweep.py
      - name: T1 unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_pachner_distance -v
      - name: T1 exact-distance baseline
        env:
          PYTHONPATH: src
        run: python scripts/pachner_distance_baseline.py --params t1-3 --attack-states 100000
      - name: T1 toy-ladder sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/pachner_distance_sweep.py --attack-states 100000
