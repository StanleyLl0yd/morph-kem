name: TDC1 lifted graphic-code negative control

on:
  pull_request:
    paths:
      - 'src/morph_kem/tdc_lifted_graphic.py'
      - 'tests/test_tdc_lifted_graphic.py'
      - 'scripts/tdc_lifted_graphic_*.py'
      - '.github/workflows/tdc1.yml'
      - 'docs/63-tdc1-lifted-graphic-code.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/tdc_lifted_graphic.py'
      - 'tests/test_tdc_lifted_graphic.py'
      - 'scripts/tdc_lifted_graphic_*.py'
      - '.github/workflows/tdc1.yml'
      - 'docs/63-tdc1-lifted-graphic-code.md'

permissions:
  contents: read

jobs:
  tdc1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile TDC1
        run: >-
          python -m compileall -q
          src/morph_kem/tdc_lifted_graphic.py
          tests/test_tdc_lifted_graphic.py
          scripts/tdc_lifted_graphic_baseline.py
          scripts/tdc_lifted_graphic_sweep.py
      - name: TDC1 unit tests
        run: python -m unittest tests.test_tdc_lifted_graphic -v
      - name: TDC1 fixed baseline
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_lifted_graphic_baseline.py --params tdc1-L18
      - name: TDC1 multi-seed sweep
        if: matrix.python-version == '3.12'
        run: python scripts/tdc_lifted_graphic_sweep.py --seeds 8
