name: HGA4f adaptive finite-representation ensemble

on:
  pull_request:
    paths:
      - 'src/morph_kem/hga_hurwitz_adaptive_quotient.py'
      - 'tests/test_hga_hurwitz_adaptive_quotient.py'
      - 'scripts/hga_hurwitz_adaptive_quotient_*.py'
      - '.github/workflows/hga4f.yml'
      - 'docs/83-hga4f-adaptive-representation-ensemble.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/hga_hurwitz_adaptive_quotient.py'
      - 'tests/test_hga_hurwitz_adaptive_quotient.py'
      - 'scripts/hga_hurwitz_adaptive_quotient_*.py'
      - '.github/workflows/hga4f.yml'
      - 'docs/83-hga4f-adaptive-representation-ensemble.md'

permissions:
  contents: read

jobs:
  hga4f:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile HGA4f
        run: >-
          python -m compileall -q
          src/morph_kem/hga_hurwitz_adaptive_quotient.py
          tests/test_hga_hurwitz_adaptive_quotient.py
          scripts/hga_hurwitz_adaptive_quotient_baseline.py
          scripts/hga_hurwitz_adaptive_quotient_sweep.py
      - name: HGA4f unit tests
        run: python -m unittest tests.test_hga_hurwitz_adaptive_quotient -v
      - name: HGA4f fixed adaptive baseline
        if: matrix.python-version == '3.12'
        run: python scripts/hga_hurwitz_adaptive_quotient_baseline.py --params hga4f-D8
      - name: HGA4f multi-seed adaptive sweep
        if: matrix.python-version == '3.12'
        run: python scripts/hga_hurwitz_adaptive_quotient_sweep.py --seeds 8
