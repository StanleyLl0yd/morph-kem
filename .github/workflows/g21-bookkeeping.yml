name: G21 one-shot A-048 bookkeeping

on:
  push:
    branches: ['g21/genus2-full-crossing-matrix']
    paths: ['.github/workflows/g21-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g21/genus2-full-crossing-matrix
      - name: Record measured G21 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          doc = Path('docs/56-g21-genus2-crossing-basis.md')
          text = doc.read_text()
          text = text.replace(
              '**G21 is an attack calibration in progress. No hardness or security conclusion is permitted until exact-head CI measures A-048.**',
              '**G21 is rejected by A-048: the full simultaneous 4x4 crossing-matrix witness is publicly constructed by tree-cotree decomposition.**'
          )
          if '## Measured A-048 result' not in text:
              text = text.rstrip() + '''\n\n## Measured A-048 result\n\nExact-head Python 3.12 `g21-6x9`:\n\n~~~text\nsuccessful flips:                           428\npublic V/E/F:                               105/321/214\nEuler characteristic:                       -2\nedge triangle incidence min/max:            2/2\nH1 dimension:                               4\nprimal degree histogram:                    ((3,18),(4,23),(5,12),(6,14),(7,5),(8,12),(9,11),(10,4),(11,1),(13,1),(14,3),(16,1))\ndual degree histogram:                      ((3,214),)\nnormalization-improving legal flips:         114\nprimal tree / forbidden dual / dual tree:    104/104/213\ntree-cotree leftovers:                       4\nprimal / dual path scans:                    25/63\nprimal cycle lengths:                        (7,7,9,6)\ndual cycle lengths:                          (6,31,10,20)\nexact crossing matrix:                       I4\noff-diagonal nonzero entries:                0\nexact verifier accepted:                     yes\nfull primal / dual basis cycles:             217/108\nfull primal / dual path scans:               923/1104\nfull crossing matrix weight:                 632\nfull crossing matrix GF(2) rank:             4\nfull crossing matrix row XORs:               65\n~~~\n\nPython 3.12 sweep over `g21-4x4`, `g21-6x6`, `g21-6x9` x eight deterministic seeds gives **24/24** public tree-cotree decompositions with exactly four leftovers, **24/24** exact identity crossing matrices, zero off-diagonal crossings in every instance, and **24/24** exact-verifier accepted eight-cycle families. The independent full primal/dual basis crossing matrix has GF(2) rank exactly four on all **24/24** instances.\n\nMeasured primary path work remains small. Maximum total primal/dual path scans are `23/55`, `30/82`, and `34/126` for the three sizes. The full basis sizes are seed-invariant: `65x32`, `145x72`, and `217x108`.\n\n### Result\n\n**G21 rejected by A-048.** Simultaneously prescribing the complete primal-dual identity crossing matrix does not create a joint inversion barrier. A public tree-cotree decomposition exposes all `2g=4` leftover edges at once, and their paired primal/dual fundamental cycles satisfy every exact diagonal and off-diagonal verifier constraint mechanically.\n\nThis is a structural cellular-topology break. Increasing carrier size or flip count is not a repair while the public embedding exposes the same tree-cotree basis. G22 must constrain cycles on the same side or otherwise impose geometry not supplied automatically by a tree-cotree decomposition.\n\nNo security claim.\n'''
          doc.write_text(text)

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-047 | Four-sheet distinct-class delete-and-recover multicurve recovery | **Fatal to G20 generated distribution** | Implemented |'
          row = '| A-048 | Full genus-two tree-cotree exact crossing-matrix recovery | **Structural break of G21 generated relation** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-047 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          if '## A-048 — full genus-two tree-cotree exact crossing-matrix recovery' not in text:
              text = text.rstrip() + '''\n\n## A-048 — full genus-two tree-cotree exact crossing-matrix recovery\n\n### Target\n\nG21 simultaneously requires four simple primal and four simple dual cycles whose exact geometric crossing-count matrix is the 4x4 identity on a flip-mixed genus-two carrier.\n\n### Public attack\n\nA-048 builds a public primal spanning tree, a dual spanning tree using no dual edge crossing the primal tree, and obtains the four genus-two leftover edges. Each leftover defines one primal fundamental cycle and its paired dual fundamental cycle. Because the dual tree never crosses a primal-tree edge, the paired cycles cross exactly once on the diagonal and zero times off diagonal.\n\n### Evidence\n\nFixed `g21-6x9` uses only 25 primal and 63 dual tree-path edge scans to build the full eight-cycle witness. The exact crossing matrix is `I4` and the verifier accepts. Independent full-basis crossing matrix dimensions are `217x108`, weight 632 and GF(2) rank 4.\n\nAcross all three sizes x eight seeds, **24/24** tree-cotree constructions expose four leftovers, produce exact `I4`, have zero off-diagonal crossings and pass the exact verifier. Full-basis rank is four in all 24 cases.\n\n### Result\n\n**G21 rejected by A-048.** This is structural for the proposed cellular relation, not an asymptotic claim about arbitrary multicurve problems.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          heading = '## 2026-09-11 — G21 rejected by A-048'
          if heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-11 — G21 rejected by A-048\n\nG21 removed G20's sequential verifier structure and required eight global cycles simultaneously: four primal and four dual, with exact geometric crossing matrix `I4`.\n\nA-048 constructs the whole family publicly in one tree-cotree decomposition. Fixed `g21-6x9`: four leftovers, 25/63 primal/dual path scans, primal lengths `7/7/9/6`, dual lengths `6/31/10/20`, exact identity matrix, exact-verifier accepted. The independent `217x108` full crossing matrix has GF(2) rank four.\n\nAcross three sizes x eight seeds, **24/24** instances expose exactly four leftovers, exact `I4`, zero off-diagonal crossings and accepted witnesses; full-basis rank is four throughout.\n\n**G21 rejected by A-048.** Simultaneous primal-dual coupling alone is not enough when public tree-cotree topology mechanically supplies the complete symplectic-style family. G22 must add same-side geometric coupling such as vertex-disjointness/intersection/avoidance or bounds that tree-cotree does not automatically satisfy. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G20 are implemented and rejected.', 'HGES controls G0–G21 are implemented and rejected.')
          if '## G21 — genus-two full crossing-matrix control' not in text:
              marker = '\n## Research discipline\n'
              section = '''\n## G21 — genus-two full crossing-matrix control\n\nG21 requires four primal and four dual simple cycles simultaneously, with exact geometric crossing-count matrix equal to `I4`.\n\n**G21 is rejected by A-048.** Public tree-cotree decomposition exposes the four genus-two leftover edges and mechanically constructs all eight cycles. Across three sizes x eight seeds, **24/24** instances produce exact `I4`, zero off-diagonal crossings and accepted verifier witnesses. The independent full crossing matrices have GF(2) rank four throughout.\n\nSee `docs/56-g21-genus2-crossing-basis.md`.\n'''
              if marker not in text:
                  raise SystemExit('README research discipline marker missing')
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/55-g20-genus2-multicurve.md` — measured G20/A-047 genus-two multicurve rejection'
          key_row = '- `docs/56-g21-genus2-crossing-basis.md` — measured G21/A-048 exact crossing-matrix rejection'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README G20 key anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G21**, not a trapdoor construction. G20 shows that moving to genus two and requiring two different public cohomology classes is still insufficient when each class can be recovered by a finite-state cover search and disjointness can be enforced by deletion.\n\nG21 must couple several global representatives simultaneously so the relation does not factor into independent class searches. The next control should prescribe a multi-cycle symplectic intersection/disjointness matrix, then immediately face public symplectic-basis construction, disjoint paths/flow/matching, shortest-cycle algorithms, ILP/SAT/CP-SAT, separator/treewidth, normalization and equivalent-witness enumeration.\n\nNo trapdoor/KEM work begins before such a coupled multicurve relation survives these attacks.\n'''
          new = '''The next controlled HGES experiment is **G22**, not a trapdoor construction. G21 shows that even a simultaneous complete primal-dual crossing matrix is not enough when a public tree-cotree decomposition mechanically supplies the required family.\n\nG22 must impose geometry not automatic from a tree-cotree basis, especially relations among cycles on the same side: vertex-disjointness, prescribed same-side intersections, shared avoidance regions, or meaningful public length constraints. It must immediately face symplectic-basis algorithms, disjoint paths/vertex splitting/max-flow, matching, shortest-cycle methods, ILP/SAT/CP-SAT, separator/treewidth, normalization and equivalent-witness enumeration.\n\nNo trapdoor/KEM work begins before such a coupled geometric multicurve relation survives these attacks.\n'''
          if old not in text:
              raise SystemExit('README G21 next gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/56-g21-genus2-crossing-basis.md docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G21: record A-048 structural rejection'
          git push origin HEAD:g21/genus2-full-crossing-matrix
