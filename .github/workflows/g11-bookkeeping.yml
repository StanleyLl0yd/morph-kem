name: G11 one-shot result bookkeeping

on:
  push:
    branches: ['g11/hges-toroidal-hypercover']
    paths: ['.github/workflows/g11-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g11/hges-toroidal-hypercover
      - name: Record measured G11 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-037 | Public toroidal bipartite perfect-matching recovery | **Fatal to G10 generated distribution** | Implemented |'
          row = '| A-038 | Public toroidal P3 hypergraph exact-cover + SAT recovery | **Fatal to G11 generated distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-037 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          heading = '## A-038 — public toroidal P3 hypergraph exact-cover + SAT recovery'
          if heading not in text:
              text = text.rstrip() + '''\n\n## A-038 — public toroidal P3 hypergraph exact-cover + SAT recovery\n\n### Target\n\nG11 toroidal P3-triomino HGES negative control.\n\nG11 moves beyond G10's pairwise graph-matching relation. Each public candidate is a three-triangle disk whose induced triangle-dual graph is `P3`, so candidate selection is a genuine 3-uniform hypergraph exact-cover problem.\n\n### Public attack\n\nA-038 enumerates every induced public dual-`P3`, filters it with the exact simplicial disk predicate, builds candidate/triangle incidence, and runs deterministic MRV Algorithm-X-style exact cover. Independently, the same candidate hypergraph is encoded to DIMACS with exactly-one constraints per public triangle and solved by MiniSat. Neither path uses the generation reference before public success.\n\n### Exact Python 3.12 `g11-6x9` result\n\n~~~text\npublic V/E/F:                         54/162/108\nEuler characteristic:                0\nedge triangle incidence min/max:     2/2\ndual vertices/edges:                 108/162\ndual degree histogram:               ((3,108),)\nbridges / articulation points:       0/0\npublic bipartition sizes:             54/54\nP3 public candidates:                324\ncandidate memberships per triangle: ((9,108),)\ncandidate overlap degree histogram:  ((18,324),)\ncandidate/triangle incidence size:   972\nexact-cover solutions / cap:         64/64\nexact-cover nodes/decisions/backtracks: 292/71/10\naccepted public solutions:           64\naccepted non-reference solutions:    64\nSAT variables / clauses:             324/3996\nMiniSat conflicts / decisions / propagations: 2/137/574\nMiniSat decoded witness accepted:    yes\nMiniSat witness matches reference:   no\n~~~\n\n### Deterministic sweep\n\nPython 3.12 tested `g11-3x6`, `g11-6x6`, and `g11-6x9` over eight deterministic public relabel seeds each with cap 32. All **24/24** attacks reach the cap; every returned witness is accepted and every returned witness is non-reference. Search remains small: at most 224 nodes on `g11-6x6` and 225 nodes on `g11-6x9` in the measured sweep.\n\n### Result\n\n**G11 is rejected by A-038.** The graph-matching shortcut is genuinely gone, but the highly regular toroidal 3-uniform candidate family remains easy for generic exact cover and SAT. Equivalent-witness multiplicity is severe and helps the attacker.\n\nDo not scale the periodic torus. G12 must test whether breaking translation symmetry/repeated local roles changes candidate-extraction or exact-cover behavior, while immediately facing automorphism/role leakage, separators/treewidth, exact cover/set packing, SAT/CP-SAT, simplification and equivalent-witness enumeration.\n\nThis is a generated-distribution falsification, not a theorem that arbitrary hypergraph exact cover or HGES is easy. No security claim.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          heading = '## 2026-09-10 — G11 rejected by A-038'
          if heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-10 — G11 rejected by A-038\n\nG11 replaced G10's adjacent-pair pieces by three-triangle `P3` disks on the periodic torus. This makes the public decomposition relation genuinely 3-uniform hypergraph exact cover: `g11-6x9` exposes 324 candidates over 108 triangles, each triangle belongs to 9 candidates, and every candidate overlaps 18 others.\n\nA-038 still breaks the generated family cheaply. Fixed Python 3.12 `g11-6x9` reaches 64/64 capped exact covers in 292 nodes / 71 decisions / 10 backtracks; all 64 returned witnesses are non-reference. Across all three sizes × eight seeds, **24/24** runs reach cap 32 and every returned witness is accepted and non-reference.\n\nIndependent MiniSat cross-check on the same largest candidate hypergraph uses 324 variables / 3996 clauses and returns SAT with 2 conflicts, 137 decisions and 574 propagations. Its decoded 36-piece cover passes the exact verifier and differs from reference.\n\n**G11 rejected by A-038.** Lesson: leaving graph matching for generic hypergraph exact cover is not enough when the public generated carrier is highly regular and exposes a dense family of equivalent local covers. G12 must break the periodic/repeated-role carrier structure before any solver growth is interpreted. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G10 are implemented and rejected.', 'HGES controls G0–G11 are implemented and rejected.')
          if '## G11 — toroidal P3 hypergraph exact-cover control' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G11 — toroidal P3 hypergraph exact-cover control\n\nG11 moves beyond pairwise perfect matching by using three-triangle `P3` disks on the periodic torus. The resulting public relation is a genuine 3-uniform hypergraph exact-cover problem.\n\n**G11 is rejected by A-038.** Fixed `g11-6x9` exposes 324 public candidates over 108 triangles; Algorithm-X-style MRV reaches 64/64 capped accepted covers in 292 nodes / 71 decisions / 10 backtracks, all non-reference. Across all three sizes and eight deterministic seeds each, **24/24** attacks reach cap 32 and every returned witness is accepted and non-reference.\n\nAn independent 324-variable / 3996-clause MiniSat encoding also returns an accepted non-reference cover, with 2 conflicts, 137 decisions and 574 propagations on the fixed baseline.\n\nThe graph-matching reduction is gone, but the regular periodic hypergraph is still easy and has massive equivalent-witness multiplicity.\n\nSee `docs/46-g11-toroidal-hypercover.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/45-g10-toroidal-matching.md` — measured G10/A-037 negative control'
          key_row = '- `docs/46-g11-toroidal-hypercover.md` — measured G11/A-038 negative control'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README G10 key-file anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G11**, not a trapdoor construction. G10 shows that even a genuinely two-dimensional candidate interaction is useless when accepted pieces have size two and decomposition is ordinary bipartite perfect matching.\n\nG11 must move to overlapping pieces of size greater than two so candidate selection is genuinely hypergraphic. Before any positive interpretation it must test toroidal/planar special structure, separators/treewidth, matching or Pfaffian reductions, candidate-subcomplex enumeration, exact cover/set packing, low-width DP, generic CSP/SAT/CP-SAT, contraction/normalization, equivalent-witness multiplicity and generated-role leakage.\n\nOnly after both public candidate extraction and the resulting hypergraph relation survive these attacks may the project ask whether a hidden decomposition gives a real recovery advantage. No trapdoor/KEM work begins before that.\n'''
          new = '''The next controlled HGES experiment is **G12**, not a trapdoor construction. G11 shows that moving from graph matching to a genuine 3-uniform exact-cover relation is still insufficient when the public carrier is highly periodic and exposes many equivalent local covers.\n\nG12 must break the repeated torus translation/local-role structure without reintroducing canonical separators. Before any positive interpretation it must test automorphism and planted-role leakage, candidate-subcomplex extraction, separator/treewidth structure, exact cover/set packing, low-width algorithms, generic CSP/SAT/CP-SAT, simplification/normalization and equivalent-witness multiplicity.\n\nOnly a distribution where public candidate extraction and the resulting irregular hypergraph both resist these attacks could justify asking whether a secret decomposition provides a recovery advantage. No trapdoor/KEM work begins before that.\n'''
          if old not in text:
              raise SystemExit('README G11 next-gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G11: record P3 hypercover rejection'
          git push origin HEAD:g11/hges-toroidal-hypercover
