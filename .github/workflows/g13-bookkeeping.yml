name: G13 one-shot generator rejection bookkeeping

on:
  push:
    branches: ['g13/random-cubic-generator-audit']
    paths: ['.github/workflows/g13-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g13/random-cubic-generator-audit
      - name: Record G13 generator-conditioning rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-039 | Public irregular-carrier P3 extraction + exact-cover / SAT recovery | **Fatal to G12 generated distribution** | Implemented |'
          row = '| A-040 | Configuration-pairing generator-conditioning audit | **Fatal to G13 carrier distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-039 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          heading = '## A-040 — configuration-pairing generator-conditioning audit'
          if heading not in text:
              text = text.rstrip() + '''\n\n## A-040 — configuration-pairing generator-conditioning audit\n\n### Target\n\nG13 proposed a non-toroidal carrier built by randomly pairing oriented sides of abstract triangles so the triangle dual would be a random simple cubic graph. Before adding any P3 witness relation, A-040 audits whether the raw distribution actually produces honest finite simplicial closed surfaces without severe hidden rejection conditioning.\n\n### Public/generator audit\n\nEach deterministic attempt pairs all triangle side stubs, rejects cubic-dual loops/parallel edges/disconnection, glues paired sides orientation-reversingly, quotients triangle corners, then checks distinct nondegenerate quotient triangles, exact two-face edge incidence, connected cyclic vertex links and integral orientable genus. Every attempt has one explicit terminal reason.\n\n### Fixed Python 3.12 audit\n\n| Set | Attempts | Dual loops | Dual parallel | Degenerate triangle | Success | 3/N scale |\n|---|---:|---:|---:|---:|---:|---:|\n| g13-36 | 4096 | 2027 | 1493 | 576 | 0 | 0.000732422 |\n| g13-54 | 4096 | 2077 | 1459 | 560 | 0 | 0.000732422 |\n| g13-72 | 4096 | 2119 | 1439 | 538 | 0 | 0.000732422 |\n\nThe Python 3.12 multi-seed audit adds eight independently derived 1024-attempt batches for each size. All **24/24 batches** again observe zero successes. Combining fixed and multi-seed budgets within each size gives 12,288 raw attempts and zero valid carriers for every distribution; the corresponding elementary `3/N` scale is `0.000244141`.\n\nEvery attempt that survived the loop/parallel checks failed immediately because at least one quotient triangle had fewer than three distinct vertices. No sample reached later duplicate-triangle, bad-edge-incidence, bad-link or genus failure classes.\n\n### Result\n\n**G13 is rejected by A-040 at the generator gate.** The naive random configuration pairing is a random-map distribution, not a healthy simplicial-surface sampler at these sizes. Hiding the failure behind unbounded rejection sampling would create a strongly conditioned public-key distribution and is not accepted as neutral setup.\n\nNo P3 exact-cover continuation is run because the declared generator rejection gate already fired. This is not a theorem that better constructive random-triangulation samplers do not exist.\n\nG14 must use a constructive non-toroidal simplicial-surface family. The next negative control is a random stacked/Apollonian sphere, with immediate degree-three/stellar-center contraction, canonicalization, P3 exact-cover, SAT and equivalent-witness attacks. No security claim.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          log_heading = '## 2026-09-11 — G13 rejected by A-040 at generator gate'
          if log_heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-11 — G13 rejected by A-040 at generator gate\n\nG13 tried to leave torus ancestry entirely by sampling random simple cubic triangle-dual pairings and gluing oriented triangle sides. Before adding any witness relation, A-040 audited whether this raw random-map distribution yields honest simplicial closed surfaces without severe rejection conditioning.\n\nFixed Python 3.12 audit: 4096 attempts at each of 36/54/72 triangles give zero successes. Eight additional 1024-attempt seeds per size also give zero successes in all 24/24 batches. Aggregated per size: 12,288 attempts, zero valid carriers, elementary `3/N = 0.000244141`.\n\nAll samples that survive dual loops/parallel edges already fail by collapsing at least one quotient triangle to fewer than three distinct vertices. No sample reaches the later simplicial edge/link/genus gates.\n\n**G13 rejected by A-040 before P3 cryptanalysis.** An unbounded rejection sampler would hide a severe generated-distribution conditioning problem. G14 must use a constructive non-toroidal simplicial family, beginning with a random stacked/Apollonian sphere and immediate public reverse-subdivision plus exact-cover/SAT attacks. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G12 are implemented and rejected.', 'HGES controls G0–G13 are implemented and rejected.')
          if '## G13 — random cubic-dual generator conditioning audit' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G13 — random cubic-dual generator conditioning audit\n\nG13 abandons torus ancestry and asks whether raw random pairings of oriented triangle sides can directly supply a healthy random simplicial-surface carrier.\n\n**G13 is rejected by A-040 before any P3 relation is studied.** For each of 36, 54 and 72 triangles, 4096 fixed attempts plus eight independent 1024-attempt batches produce **0/12,288** honest simplicial surfaces. Pairings either contain a dual loop/parallel edge or, after those checks, collapse at least one quotient triangle. The per-size `3/N` scale after 12,288 zero-success attempts is `0.000244141`.\n\nThe project will not hide this behind unbounded rejection sampling. See `docs/48-g13-random-pairing-generator.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/47-g12-irregular-torus-hypercover.md` — measured G12/A-039 negative control'
          key_row = '- `docs/48-g13-random-pairing-generator.md` — measured G13/A-040 generator-conditioning rejection'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README key-file anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G13**, not a trapdoor construction. G12 shows that destroying periodic translation symmetry with many local edge flips is still insufficient: the public P3 candidate hypergraph remains easy for exact cover and SAT.\n\nG13 must abandon the periodic-torus-plus-local-flips carrier family rather than stack more cosmetic irregularization. Before any positive interpretation it must face canonicalization/isomorphism, separator/treewidth analysis, candidate-subcomplex extraction, exact cover/set packing, generic CSP/SAT/CP-SAT, simplification/normalization, equivalent-witness multiplicity and generated-role leakage.\n\nOnly a relation where both the carrier and its induced candidate hypergraph survive these attacks could justify asking whether a secret decomposition provides a recovery advantage. No trapdoor/KEM work begins before that.\n'''
          new = '''The next controlled HGES experiment is **G14**, not a trapdoor construction. G13 shows that a naive random cubic-dual configuration model is not even a healthy simplicial-surface sampler without extreme rejection conditioning.\n\nG14 therefore uses a constructive non-toroidal family: random stacked/Apollonian 2-spheres generated by repeated face subdivision. Because this construction has an obvious potential public inverse, the first attack must enumerate degree-three vertices / stellar centers and contract them, alongside canonicalization, P3 candidate extraction, exact cover, SAT, equivalent-witness multiplicity and generated-role leakage.\n\nNo trapdoor/KEM work begins before a constructive carrier and its witness relation survive these public attacks.\n'''
          if old not in text:
              raise SystemExit('README G13 next-gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G13: record generator-conditioning rejection'
          git push origin HEAD:g13/random-cubic-generator-audit
