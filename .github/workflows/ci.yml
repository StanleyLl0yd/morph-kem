name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: M0 exhaustive toy-8 baseline
        env:
          PYTHONPATH: src
        run: python scripts/exhaustive_baseline.py --params toy-8 --seed 0xA5
      - name: M1 meet-in-the-middle path-16 baseline
        env:
          PYTHONPATH: src
        run: python scripts/mitm_baseline.py --params path-16 --seed 0xB6D3
      - name: M2 collapse-maze baseline
        env:
          PYTHONPATH: src
        run: python scripts/maze_baseline.py --params maze-6 --trials 16 --search-nodes 10000
