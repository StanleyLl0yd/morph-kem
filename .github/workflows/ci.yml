name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: M0 exhaustive toy-8 baseline
        env:
          PYTHONPATH: src
        run: python scripts/exhaustive_baseline.py --params toy-8 --seed 0xA5
      - name: M1 meet-in-the-middle path-16 baseline
        env:
          PYTHONPATH: src
        run: python scripts/mitm_baseline.py --params path-16 --seed 0xB6D3
      - name: M2 collapse-maze baseline
        env:
          PYTHONPATH: src
        run: python scripts/maze_baseline.py --params maze-6 --trials 16 --search-nodes 10000
      - name: M2 structural core recovery sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/maze_core_sweep.py --max-nodes 2000000
      - name: M3 equivalent-witness baseline
        env:
          PYTHONPATH: src
        run: python scripts/morse_baseline.py --params morse-6 --collapse-trials 16 --greedy-trials 4
      - name: M3 constructive attack sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/morse_sweep.py --collapse-trials 32 --greedy-trials 8
      - name: M4 torus tree-cotree baseline
        env:
          PYTHONPATH: src
        run: python scripts/surface_baseline.py --params torus-4x4 --tree-trials 16 --greedy-trials 4
      - name: M4 tree-cotree scaling sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/surface_sweep.py --trials 32
      - name: H1 signed-holonomy baseline
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/holonomy_baseline.py --params h1-12 --solution-cap 64
      - name: H1 signed-holonomy scaling sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/holonomy_sweep.py --solution-cap 8
      - name: H2-E Escher atlas baseline
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/escher_baseline.py --params escher-12 --max-nodes 1000000
      - name: H2-E Escher atlas scaling sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/escher_sweep.py --max-nodes 1000000
      - name: H2-E2 higher-order Escher baseline
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/higher_atlas_baseline.py --params atlas-12 --max-nodes 2000000
      - name: H2-E2 higher-order Escher scaling sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/higher_atlas_sweep.py --max-nodes 2000000
      - name: H3-E0 lifted-atlas gauge baseline
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/lifted_atlas_baseline.py --params lift-12x5
