name: G9 one-shot result bookkeeping

on:
  push:
    branches: ['g9/hges-overlapping-exact-cover']
    paths: ['.github/workflows/g9-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g9/hges-overlapping-exact-cover
      - name: Record measured G9 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-035 | Public local-phase extraction and topology-to-CSP factorization | **Structural break of G4–G7 design line** | Implemented |'
          row = '| A-036 | Public overlapping-piece enumeration + exact cover / cycle DP | **Fatal to G9 generated distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-035 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          if '## A-036 — public overlapping-piece enumeration + exact cover / cycle DP' not in text:
              text = text.rstrip() + '''\n\n## A-036 — public overlapping-piece enumeration + exact cover / cycle DP\n\n### Target\n\nG9 overlapping-carrier HGES negative control.\n\nG9 removes the direct G8/A-035 architecture of a public tuple of disjoint local gadgets. Instead, one connected tetrahedron-cycle complex exposes two allowed piece types, D2 and D3, whose public candidate carriers overlap directly in tetrahedra.\n\n### Public attack\n\nA-036 uses no planted carrier boundaries. It builds public face incidence and the tetrahedron dual graph, enumerates all valid D2 dual edges and D3 length-two dual paths, validates each candidate by the exact simplicial piece predicate, and solves the resulting candidate/tetrahedron exact-cover relation with the public piece-count constraint.\n\nAn independent public attack derives a canonical dual-cycle traversal and enumerates the required length-2/length-3 cyclic compositions by bounded-state dynamic programming. Covers from both paths are normalized and checked by the exact G9 verifier.\n\n### Exact Python 3.12 `g9-30` result\n\n~~~text\npublic tetrahedra / witness pieces:       30/11\nrequired D2/D3 pieces:                    3/8\npublic V/E/F/T:                           32/91/90/30\nEuler characteristic:                    1\nboundary faces / max face incidence:      60/2\ndual graph vertices / edges:              30/30\ndual degree histogram:                    ((2,30),)\nbridges / articulation points:             0/0\nD2 / D3 public candidates:                30/30\ncandidate memberships per tetrahedron:    ((5,30),)\ncandidate overlap-degree histogram:       ((6,30),(8,30))\ncandidate/tetrahedron incidence size:     150\nface occurrence checks:                   120\nexact-cover solutions / cap:              450/1024\nexact-cover nodes / backtracks:           2820/899\ncycle-DP states / transitions / tilings:  36/70/450\naccepted public solutions:                450\naccepted non-reference solutions:        449\nreference witness accepted:               yes\n~~~\n\n### Deterministic sweep\n\n| Set | Exact-cover solutions | Exact-cover nodes/backtracks | DP states/transitions/tilings | Accepted | Non-reference |\n|---|---:|---:|---:|---:|---:|\n| g9-18 | 90 | 420/102 | 20/38/90 | 90 | 89 |\n| g9-24 | 224 | 1211/345 | 28/54/224 | 224 | 223 |\n| g9-30 | 450 | 2820/899 | 36/70/450 | 450 | 449 |\n\nPython 3.12 tested all three sets over eight independently derived deterministic seeds. All **24/24** instances have zero bridges and articulation points, exactly `T` D2 and `T` D3 candidates, five candidate memberships per tetrahedron, and exact agreement between analytic cyclic-tiling count, exact-cover enumeration and cycle-DP enumeration. Every recovered cover is accepted.\n\n### Result\n\n**G9 is rejected by A-036.**\n\nOverlapping the local carriers removes independent phase extraction, but the public candidate hypergraph is still a bounded-width interval/cycle relation. Exact cover and cycle DP recover all accepted tilings cheaply. Equivalent-witness multiplicity is severe: `g9-30` has 450 accepted witnesses, 449 non-reference.\n\nDo not scale the cycle. A G10 successor must change the public overlap interaction graph itself and must be attacked first for separators/treewidth, motif/link normalization, candidate-subcomplex enumeration, exact cover/set packing, matching, low-width DP, generic CSP/SAT/CP-SAT, contraction/quotient simplification, equivalent witnesses and generated-role leakage.\n\nThis is a generated-distribution falsification, not a theorem that general HGES or general exact cover is easy. No security claim.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          heading = '## 2026-09-10 — G9 rejected by A-036'
          if heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-10 — G9 rejected by A-036\n\nG9 removed the G4–G8 independent local phase-domain architecture by publishing one connected tetrahedron-cycle complex with overlapping D2/D3 candidate carriers. Every tetrahedron belongs to five public candidates.\n\nA-036 enumerates those candidates and solves exact cover; an independent cycle-composition DP derives the same witness family from the public dual cycle. Fixed Python 3.12 `g9-30`: 30 tetrahedra / 11 pieces, 30 D2 + 30 D3 candidates, exact-cover 450 solutions in 2820 nodes / 899 backtracks, cycle DP 36 states / 70 transition checks / 450 tilings, all 450 accepted and 449 non-reference.\n\nAcross `g9-18`, `g9-24`, `g9-30` × eight seeds, **24/24** instances produce exact agreement between exact cover and cycle DP: respectively 90, 224 and 450 accepted tilings, with all but the planted reference available as equivalent attacker witnesses.\n\n**G9 rejected by A-036.** Lesson: breaking independent phase extraction is necessary but not sufficient. If public candidate carriers form a low-width interval/cycle overlap relation, decomposition remains a cheap exact-cover/DP problem and equivalent-witness multiplicity becomes even worse. G10 must change the overlap interaction graph and measure separator/treewidth structure before any solver growth is interpreted. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G8 are implemented and rejected.', 'HGES controls G0–G9 are implemented and rejected.')
          if '## G9 — overlapping-carrier HGES exact-cover control' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G9 — overlapping-carrier HGES exact-cover control\n\nG9 removes the independent local phase domains broken by G8. It publishes one connected tetrahedron-cycle complex whose allowed D2/D3 candidate pieces overlap directly in public tetrahedra.\n\n**G9 is rejected by A-036.** Public candidate-subcomplex enumeration followed by exact cover finds 90, 224 and 450 accepted tilings for `g9-18`, `g9-24` and `g9-30`; an independent public cycle-composition DP obtains exactly the same counts. On `g9-30`, exact cover uses 2820 nodes / 899 backtracks and all 450 recovered covers verify, including 449 non-reference witnesses.\n\nAcross all three sets and eight deterministic seeds each, **24/24** instances reproduce the same break. Overlap by itself is therefore not enough when the candidate hypergraph is a bounded-width interval/cycle relation.\n\nSee `docs/44-g9-overlapping-exact-cover.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/43-g8-topology-csp-collapse.md` — measured G8/A-035 structural collapse audit'
          key_row = '- `docs/44-g9-overlapping-exact-cover.md` — measured G9/A-036 negative control'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README key-file anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G9**, not a trapdoor construction. G8 shows that adding increasingly sophisticated global CSP predicates over independently enumerable local topological phase gadgets does not create topological hardness: the topology can be compiled away before solving.\n\nG9 must therefore attack the premise of `PhaseExtract` itself. A useful negative control should overlap/entangle candidate local decompositions across public boundaries so there is no cheap independent per-gadget domain table. Before any positive interpretation it must face multiscale decomposition, separator/link/motif, normalization/automorphism, overlapping exact-cover/CSP/SAT/CP-SAT, low-width, equivalent-witness, generated-role leakage, and contraction/quotient attacks.\n\nOnly a relation where public extraction of a compact local witness domain itself survives these attacks could justify asking whether a secret decomposition supplies a real recovery advantage. No trapdoor/KEM work begins before that.\n'''
          new = '''The next controlled HGES experiment is **G10**, not a trapdoor construction. G9 shows that eliminating independent local phase domains is still insufficient when public candidate carriers form a bounded-width interval/cycle overlap relation.\n\nG10 must change the overlap interaction graph itself. Before any positive interpretation, first measure public separator and treewidth structure of the candidate-overlap graph and attempt decomposition-based dynamic programming. It must also face multiscale motif/link normalization, candidate-subcomplex enumeration, exact cover/set packing, matching, generic CSP/SAT/CP-SAT, contraction/quotient simplification, equivalent-witness enumeration and generated-role leakage.\n\nOnly a relation where both public candidate extraction and the resulting overlap interaction resist these attacks could justify asking whether a secret decomposition supplies a real recovery advantage. No trapdoor/KEM work begins before that.\n'''
          if old not in text:
              raise SystemExit('README G9 next-gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G9: record overlapping exact-cover rejection'
          git push origin HEAD:g9/hges-overlapping-exact-cover
