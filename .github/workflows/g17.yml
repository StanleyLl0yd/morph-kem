name: G17 HGES primal-dual symplectic cycle-pair negative control

on:
  push:
    paths:
      - 'src/morph_kem/gluing_symplectic_cycle_pair.py'
      - 'tests/test_gluing_symplectic_cycle_pair.py'
      - 'scripts/gluing_symplectic_cycle_pair_*.py'
      - '.github/workflows/g17.yml'
      - 'docs/52-g17-symplectic-cycle-pair.md'
  pull_request:
    paths:
      - 'src/morph_kem/gluing_symplectic_cycle_pair.py'
      - 'tests/test_gluing_symplectic_cycle_pair.py'
      - 'scripts/gluing_symplectic_cycle_pair_*.py'
      - '.github/workflows/g17.yml'
      - 'docs/52-g17-symplectic-cycle-pair.md'

permissions:
  contents: read

jobs:
  g17:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile G17
        run: >-
          python -m compileall -q
          src/morph_kem/gluing_symplectic_cycle_pair.py
          tests/test_gluing_symplectic_cycle_pair.py
          scripts/gluing_symplectic_cycle_pair_baseline.py
          scripts/gluing_symplectic_cycle_pair_sweep.py
      - name: G17 unit tests
        run: python -m unittest tests.test_gluing_symplectic_cycle_pair -v
      - name: G17 fixed baseline
        run: python scripts/gluing_symplectic_cycle_pair_baseline.py --params g17-8x9
      - name: G17 multi-seed sweep
        if: matrix.python-version == '3.12'
        run: python scripts/gluing_symplectic_cycle_pair_sweep.py --seeds 8
