name: G19 HGES vertex-disjoint cohomology-pair negative control

on:
  pull_request:
    paths:
      - 'src/morph_kem/gluing_disjoint_cohomology_pair.py'
      - 'tests/test_gluing_disjoint_cohomology_pair.py'
      - 'scripts/gluing_disjoint_cohomology_pair_*.py'
      - 'docs/54-g19-disjoint-cohomology-pair.md'
      - 'docs/05-cryptanalysis.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/g19.yml'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/gluing_disjoint_cohomology_pair.py'
      - 'tests/test_gluing_disjoint_cohomology_pair.py'
      - 'scripts/gluing_disjoint_cohomology_pair_*.py'
      - 'docs/54-g19-disjoint-cohomology-pair.md'
      - 'docs/05-cryptanalysis.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/g19.yml'

permissions:
  contents: read

jobs:
  g19:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile G19
        run: >-
          python -m compileall -q
          src/morph_kem/gluing_disjoint_cohomology_pair.py
          tests/test_gluing_disjoint_cohomology_pair.py
          scripts/gluing_disjoint_cohomology_pair_baseline.py
          scripts/gluing_disjoint_cohomology_pair_sweep.py
      - name: G19 unit tests
        run: python -m unittest tests.test_gluing_disjoint_cohomology_pair -v
      - name: G19 fixed baseline
        run: python scripts/gluing_disjoint_cohomology_pair_baseline.py --params g19-8x9
      - name: G19 multi-seed sweep
        if: matrix.python-version == '3.12'
        run: python scripts/gluing_disjoint_cohomology_pair_sweep.py --seeds 8
