name: G20 one-shot dense-label fix

on:
  push:
    branches: ['g20/genus2-multicurve']
    paths: ['.github/workflows/g20-dense-label-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g20/genus2-multicurve
      - name: Canonicalize connected-sum vertex labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/morph_kem/gluing_genus2_multicurve.py')
          text = path.read_text()
          old = '''    if incidence.min_triangles_per_edge != 2 or incidence.max_triangles_per_edge != 2:\n        raise GluingExperimentError("G20 connected sum is not closed")\n    return target\n'''
          new = '''    if incidence.min_triangles_per_edge != 2 or incidence.max_triangles_per_edge != 2:\n        raise GluingExperimentError("G20 connected sum is not closed")\n    dense_labels = {vertex: index for index, vertex in enumerate(target.vertices)}\n    return target.relabel(dense_labels)\n'''
          if old not in text:
              raise SystemExit('G20 connected-sum return anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/morph_kem/gluing_genus2_multicurve.py
          git commit -m 'G20: canonicalize connected-sum vertex labels'
          git push origin HEAD:g20/genus2-multicurve
