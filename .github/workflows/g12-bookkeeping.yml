name: G12 one-shot result bookkeeping

on:
  push:
    branches: ['g12/hges-irregular-torus-hypercover']
    paths: ['.github/workflows/g12-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g12/hges-irregular-torus-hypercover
      - name: Record measured G12 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-038 | Public toroidal P3 hypergraph exact-cover + SAT recovery | **Fatal to G11 generated distribution** | Implemented |'
          row = '| A-039 | Public irregular-carrier P3 extraction + exact-cover / SAT recovery | **Fatal to G12 generated distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-038 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          heading = '## A-039 — public irregular-carrier P3 extraction + exact-cover / SAT recovery'
          if heading not in text:
              text = text.rstrip() + '''\n\n## A-039 — public irregular-carrier P3 extraction + exact-cover / SAT recovery\n\n### Target\n\nG12 edge-flipped irregular-torus P3 hypercover negative control. G12 applies many legal `2 <-> 2` flips before reference-cover selection, destroying G11's periodic translation pattern and uniform local roles.\n\n### Public attack\n\nA-039 derives only the final public edge/triangle incidence, enumerates every exact P3-surface candidate, solves the candidate/triangle hypergraph with deterministic MRV exact cover, and independently encodes the same relation to DIMACS for MiniSat. Reference data is consulted only after public acceptance.\n\n### Exact Python 3.12 `g12-8x9` result\n\n~~~text\nsuccessful flips / generation retries:      72/0\npublic V/E/F:                               72/216/144\nEuler characteristic:                       0\nedge triangle incidence min/max:            2/2\nprimal vertex-degree classes:               9\ndual vertices / edges:                      144/216\ndual degree histogram:                      ((3,144),)\ndual bipartite:                             no\nbridges / articulation points:              0/0\ndual triangle / four-cycle counts:          8/9\nlocal signature classes:                    82\nnormalization-improving legal flips:         59\nP3 public candidates:                       408\ncandidate memberships:                      6:24 / 9:120\ncandidate/triangle incidence:               1224\nexact-cover solutions / cap:                64/64\nexact-cover nodes / decisions / backtracks: 456/119/119\naccepted public solutions:                  64\naccepted non-reference solutions:          64\n~~~\n\nIndependent MiniSat uses 408 variables / 4824 clauses and reports SAT with 105 conflicts, 807 decisions and 4699 propagations in 0.005333 s. The decoded 48-piece witness passes the exact verifier and differs from the reference.\n\n### Deterministic sweep\n\nPython 3.12 tested `g12-6x6`, `g12-6x9`, `g12-8x9` over eight deterministic seeds each. All **24/24** instances require zero generation retries, become non-bipartite and publicly irregular, reach the 32-solution exact-cover cap, and return 32/32 accepted non-reference covers. Maximum exact-cover nodes are 276, 366 and 761 respectively.\n\n### Result\n\n**G12 is rejected by A-039.** Destroying periodic translation symmetry and uniform local roles does not make the generated P3 hypercover hard: generic candidate extraction, exact cover and SAT remain cheap. The public normalization probe also finds many degree-regularizing legal flips. Do not increase flip count, torus size or retry depth as a repair.\n\nG13 must leave the periodic-torus-plus-local-flips family and immediately face canonicalization/isomorphism, separators/treewidth, candidate extraction, exact cover/set packing, SAT/CP-SAT, simplification/normalization, equivalent witnesses and generated-role leakage. No security claim.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          log_heading = '## 2026-09-11 — G12 rejected by A-039'
          if log_heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-11 — G12 rejected by A-039\n\nG12 tested whether G11 failed only because of periodic torus symmetry. The carrier is first irregularized by 36/54/72 deterministic legal edge flips and only then conditioned on existence of a public P3 exact cover. All 24 measured instances required zero generation retries.\n\nThe irregularity gate is real: fixed `g12-8x9` has nine primal vertex-degree classes, a non-bipartite 3-regular dual, 82 combined local signature classes, nonuniform P3 candidate memberships, and 59 legal public flips that move the degree profile toward the regular torus.\n\nA-039 still breaks the relation cheaply. Fixed `g12-8x9`: 408 candidates, exact cover 64/64 accepted non-reference solutions in 456 nodes / 119 decisions / 119 backtracks. MiniSat on 408 variables / 4824 clauses returns an accepted non-reference witness with 105 conflicts / 807 decisions / 4699 propagations. Across all three sizes × eight seeds, **24/24** runs hit the 32-solution cap and every returned cover is non-reference; max exact-cover work is 761 nodes.\n\n**G12 rejected by A-039.** Lesson: local edge-flip irregularization is cosmetic with respect to this candidate-extraction relation. G13 must abandon the periodic-torus/local-flip carrier family rather than add more disorder. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G11 are implemented and rejected.', 'HGES controls G0–G12 are implemented and rejected.')
          if '## G12 — irregular-torus P3 hypercover control' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G12 — irregular-torus P3 hypercover control\n\nG12 destroys G11's periodic local-role symmetry with many legal edge flips before reference-cover selection. The fixed `g12-8x9` carrier has nine primal degree classes, is dual-non-bipartite, exposes 82 public local signature classes, and has nonuniform P3 candidate memberships.\n\n**G12 is rejected by A-039.** Public exact cover still reaches 64/64 accepted covers in 456 nodes / 119 decisions / 119 backtracks, all non-reference. Independent MiniSat solves the 408-variable / 4824-clause candidate hypergraph in about 0.005 s and its decoded witness passes the exact verifier. Across `g12-6x6`, `g12-6x9`, `g12-8x9` × eight seeds, **24/24** instances hit the 32-solution cap with every returned cover non-reference and no generation retries.\n\nSee `docs/47-g12-irregular-torus-hypercover.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/46-g11-toroidal-hypercover.md` — measured G11/A-038 negative control'
          key_row = '- `docs/47-g12-irregular-torus-hypercover.md` — measured G12/A-039 negative control'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README key-file anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G12**, not a trapdoor construction. G11 shows that moving from graph matching to a genuine 3-uniform exact-cover relation is still insufficient when the public carrier is highly periodic and exposes many equivalent local covers.\n\nG12 must break the repeated torus translation/local-role structure without reintroducing canonical separators. Before any positive interpretation it must test automorphism and planted-role leakage, candidate-subcomplex extraction, separator/treewidth structure, exact cover/set packing, low-width algorithms, generic CSP/SAT/CP-SAT, simplification/normalization and equivalent-witness multiplicity.\n\nOnly a distribution where public candidate extraction and the resulting irregular hypergraph both resist these attacks could justify asking whether a secret decomposition provides a recovery advantage. No trapdoor/KEM work begins before that.\n'''
          new = '''The next controlled HGES experiment is **G13**, not a trapdoor construction. G12 shows that destroying periodic translation symmetry with many local edge flips is still insufficient: the public P3 candidate hypergraph remains easy for exact cover and SAT.\n\nG13 must abandon the periodic-torus-plus-local-flips carrier family rather than stack more cosmetic irregularization. Before any positive interpretation it must face canonicalization/isomorphism, separator/treewidth analysis, candidate-subcomplex extraction, exact cover/set packing, generic CSP/SAT/CP-SAT, simplification/normalization, equivalent-witness multiplicity and generated-role leakage.\n\nOnly a relation where both the carrier and its induced candidate hypergraph survive these attacks could justify asking whether a secret decomposition provides a recovery advantage. No trapdoor/KEM work begins before that.\n'''
          if old not in text:
              raise SystemExit('README G12 next-gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G12: record irregular-hypercover rejection'
          git push origin HEAD:g12/hges-irregular-torus-hypercover
