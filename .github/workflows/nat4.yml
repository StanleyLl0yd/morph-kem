name: NAT4 locally-flat A5 gauge control

on:
  pull_request:
    paths:
      - 'src/morph_kem/nat_a5_flat.py'
      - 'tests/test_nat_a5_flat.py'
      - 'scripts/nat_a5_flat_*.py'
      - '.github/workflows/nat4.yml'
      - 'docs/72-nat4-locally-flat-gauge.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/nat_a5_flat.py'
      - 'tests/test_nat_a5_flat.py'
      - 'scripts/nat_a5_flat_*.py'
      - '.github/workflows/nat4.yml'
      - 'docs/72-nat4-locally-flat-gauge.md'

permissions:
  contents: read

jobs:
  nat4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile NAT4
        run: >-
          python -m compileall -q
          src/morph_kem/nat_a5_flat.py
          tests/test_nat_a5_flat.py
          scripts/nat_a5_flat_baseline.py
          scripts/nat_a5_flat_sweep.py
      - name: NAT4 unit tests
        run: python -m unittest tests.test_nat_a5_flat -v
      - name: NAT4 fixed gauge baseline
        if: matrix.python-version == '3.12'
        run: python scripts/nat_a5_flat_baseline.py --params nat4-F36
      - name: NAT4 multi-seed gauge sweep
        if: matrix.python-version == '3.12'
        run: python scripts/nat_a5_flat_sweep.py --seeds 8
