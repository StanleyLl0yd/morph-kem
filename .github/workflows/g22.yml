name: G22 HGES same-side genus-two multicurve control

on:
  pull_request:
    paths:
      - 'src/morph_kem/gluing_genus2_same_side.py'
      - 'tests/test_gluing_genus2_same_side.py'
      - 'scripts/gluing_genus2_same_side_*.py'
      - 'docs/60-g22-same-side-multicurve.md'
      - '.github/workflows/g22.yml'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/gluing_genus2_same_side.py'
      - 'tests/test_gluing_genus2_same_side.py'
      - 'scripts/gluing_genus2_same_side_*.py'
      - 'docs/60-g22-same-side-multicurve.md'
      - '.github/workflows/g22.yml'

permissions:
  contents: read

jobs:
  g22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile G22
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/morph_kem/gluing_genus2_same_side.py tests/test_gluing_genus2_same_side.py scripts/gluing_genus2_same_side_baseline.py scripts/gluing_genus2_same_side_sweep.py
      - name: G22 unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_gluing_genus2_same_side -v
      - name: G22 fixed baseline
        env:
          PYTHONPATH: src
        run: python scripts/gluing_genus2_same_side_baseline.py --params g22-6x9
      - name: G22 multi-seed sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/gluing_genus2_same_side_sweep.py --seeds 8
