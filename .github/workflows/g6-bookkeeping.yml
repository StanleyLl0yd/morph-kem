name: G6 one-shot result bookkeeping

on:
  push:
    branches: ['g6/hges-affine-coset-residual']
    paths: ['.github/workflows/g6-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g6/hges-affine-coset-residual
      - name: Record measured G6 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-032 | Public exact-one parity projection | **Fatal to G5 generated distribution** | Implemented |'
          row = '| A-033 | Affine-coset residual exact-one enumeration | **Fatal to G6 generated distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-032 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          if '## A-033 — affine-coset residual exact-one enumeration' not in text:
              text = text.rstrip() + '''\n\n## A-033 — affine-coset residual exact-one enumeration\n\n### Target\n\nG6 residual-affine HGES negative control.\n\nG6 keeps G5's nonlinear signed exact-one verifier but changes the public clause scopes so the necessary GF(2) parity projection is deliberately incomplete: the coefficient matrix has rank `g-2`, nullity `2`, leaving four public affine phase candidates.\n\n### Public attack\n\nA-033 uses no hidden reference phases:\n\n1. enumerate and canonically order the two public G3 matching phases for every gadget;\n2. project every exact-one clause to its necessary affine GF(2) equation;\n3. Gauss-Jordan reduce the public system;\n4. recover a particular solution and the two-dimensional nullspace;\n5. enumerate all four affine phase candidates;\n6. evaluate every public nonlinear exact-one clause for every candidate;\n7. lift surviving phase candidates to local matching witnesses;\n8. submit survivors to the exact nonlinear verifier;\n9. compare to generation history only after public acceptance.\n\n### Exact Python 3.12 `g6-24` result\n\n~~~text\ngadgets:                                  24\ntotal public tetrahedra:                 144\nclauses:                                  48\nvariable degree histogram:               ((6,24),)\nfactor components / cycle rank:          1/73\nlocal matching nodes / backtracks:       168/0\nprojected equations / variables:          48/24\nGF(2) rank / nullity:                     22/2\nGF(2) row XORs:                           308\naffine candidates:                         4\nresidual nonlinear clause checks:         192\naccepted affine candidates:                 1\nexact verifier clause checks:              48\naccepted non-reference candidates:          0\nfirst accepted candidate = reference:      yes\nreference witness accepted:                yes\n~~~\n\n### Deterministic sweep\n\nPython 3.12 tested `g6-12`, `g6-18`, and `g6-24` over eight independently derived deterministic seeds each.\n\n| Set | Rank/nullity | Affine candidates | GF(2) row XORs | Local matching nodes/backtracks | Residual checks | Accepted | Non-reference |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| g6-12 | 10/2 | 4 | 92 | 84/0 | 96 | 1 | 0 |\n| g6-18 | 16/2 | 4 | 188 | 126/0 | 144 | 1 | 0 |\n| g6-24 | 22/2 | 4 | 308 | 168/0 | 192 | 1 | 0 |\n\nAll **24/24** generated instances expose exactly four affine candidates. A-033 finds exactly one nonlinear-valid public candidate in every instance; all **24/24** accepted candidates equal the hidden reference only under post-attack comparison.\n\n### Result\n\n**G6 is rejected by A-033.**\n\nUnlike G5, the cheap affine quotient is genuinely incomplete, but its residual dimension is a fixed two bits. Exhaustively checking four public candidates is therefore a constant-size residual attack, not a cryptographic hardness source. Increasing `g` while preserving nullity two cannot repair the relation.\n\nThis is not a theorem that exact-one CSP or general HGES is easy. It falsifies this generated family and sharpens the next gate: quotient residual complexity must itself grow and survive dedicated solver attacks.\n\n### G7 gate\n\nA successor must ensure that every cheap quotient leaves residual entropy/search dimension growing with the generated instance, then face exact CSP/SAT, local consistency, low-width algorithms, normalization, equivalent-witness enumeration, and generated-role leakage before any trapdoor work.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          if '### G6 — affine-coset residual control' not in text:
              text = text.rstrip() + '''\n\n### G6 — affine-coset residual control\n\nKept the nonlinear G5 exact-one verifier but changed the circulant clause scopes so the public parity projection has rank `g-2` and nullity `2`. Thus the attacker no longer obtains the witness directly from GF(2); it obtains a four-element affine coset.\n\nA-033 enumerates that entire public coset and evaluates all nonlinear clauses for every candidate before exact-verifier confirmation. Exact-head Python 3.12 `g6-24` gives rank/nullity `22/2`, 308 row XORs, four affine candidates, 192 residual clause checks, one accepted candidate and 48 final verifier checks.\n\nAcross `g6-12`, `g6-18`, `g6-24` × eight seeds, **24/24** instances expose exactly four affine candidates and exactly one nonlinear-valid public witness; all accepted witnesses match the hidden reference only in post-attack comparison.\n\n**G6 rejected by A-033.**\n\nLesson: making the affine quotient incomplete is necessary but not sufficient. A constant two-bit residual is still trivial. G7 must make cheap-quotient residual dimension grow with the instance and attack that growing residual with exact CSP/SAT and structural methods.\n'''
              log.write_text(text)

          doc = Path('docs/41-g6-affine-coset-residual.md')
          text = doc.read_text()
          text = text.replace(
              '**G6 is an attack calibration in progress.** G6 deliberately leaves a four-element affine residual after the cheapest parity projection. No hardness or security conclusion is permitted until exact-head CI records A-033 against the original nonlinear verifier.',
              '**G6 is rejected by A-033.** Exact-head Python 3.12 confirms that the public parity projection leaves exactly four affine candidates at every declared size and exhaustive residual verification recovers one accepted nonlinear witness.'
          )
          old = '''## Predicted structural work\n\nBefore exact-head CI, the declared templates predict:\n\n| Set | Rank/nullity | Affine candidates | GF(2) row XORs | Local matching nodes/backtracks | Residual clause checks |\n|---|---:|---:|---:|---:|---:|\n| g6-12 | 10/2 | 4 | 92 | 84/0 | 96 |\n| g6-18 | 16/2 | 4 | 188 | 126/0 | 144 |\n| g6-24 | 22/2 | 4 | 308 | 168/0 | 192 |\n\nThese are regression predictions, not a measured security statement.\n\n## Rejection gate\n\nReject G6 if exhaustive enumeration of the four-element affine coset yields any witness accepted by the original nonlinear verifier. If only one candidate survives, the distribution still fails: a constant-size residual search is not a hardness source. If multiple candidates survive, equivalent-witness multiplicity makes the rejection stronger.\n\nDo not increase `g` while the projected nullity remains fixed at two.\n'''
          new = '''## Measured result\n\nFixed Python 3.12 `g6-24` baseline:\n\n~~~text\ngadgets:                               24\ntotal public tetrahedra:              144\nclauses:                               48\nvariable degree histogram:            ((6,24),)\nfactor components / cycle rank:       1/73\nlocal matching nodes/backtracks:      168/0\nprojected equations/variables:        48/24\nGF(2) rank/nullity:                   22/2\nGF(2) row XORs:                       308\naffine candidates:                      4\nresidual nonlinear clause checks:      192\naccepted affine candidates:              1\nexact verifier clause checks:           48\naccepted non-reference candidates:       0\nfirst accepted matches reference:       yes\n~~~\n\nPython 3.12 sweep over `g6-12`, `g6-18`, `g6-24` × eight deterministic seeds gives **24/24** instances with nullity two, four affine candidates, exactly one accepted nonlinear candidate, and zero accepted non-reference candidates. Per-size row-XOR work is `92`, `188`, `308`; full residual clause checks are `96`, `144`, `192`.\n\n**Result: G6 rejected by A-033.** The affine quotient is not solver-complete, but its residual is only two bits. Exhaustive enumeration of four candidates is a constant-size public attack. Do not scale `g` while that residual dimension remains fixed.\n'''
          if old not in text:
              raise SystemExit('docs41 predicted/rejection anchor missing')
          text = text.replace(old, new, 1)
          doc.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G5 are implemented and rejected.', 'HGES controls G0–G6 are implemented and rejected.')
          marker = '\n## Research discipline\n'
          if '## G6 — affine-coset residual HGES control' not in text:
              section = '''\n## G6 — affine-coset residual HGES control\n\nG6 keeps G5's nonlinear exact-one verifier but deliberately reduces the rank of its public parity projection so two affine bits remain free. Every instance therefore exposes four public affine candidates rather than one.\n\n**G6 is rejected by A-033.** On `g6-24`, the public 48×24 parity system has rank/nullity `22/2`; the attacker enumerates four affine candidates, performs 192 nonlinear clause checks, and exactly one candidate survives and passes the exact verifier.\n\nAcross `g6-12`, `g6-18`, `g6-24` and eight deterministic seeds each, **24/24** instances expose four candidates and exactly one accepted public witness. The residual dimension is constant, so scaling the gadget count is not a repair.\n\nSee `docs/41-g6-affine-coset-residual.md`.\n'''
              if marker not in text:
                  raise SystemExit('README research anchor missing')
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/40-g5-exact-one-parity.md` — measured G5/A-032 negative control'
          key_row = '- `docs/41-g6-affine-coset-residual.md` — measured G6/A-033 negative control'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README docs40 anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old_gate = '''The next controlled HGES experiment is **G6**, not a trapdoor construction. G5 showed that merely changing the visible predicate from XOR to nonlinear exact-one is insufficient when a full-rank affine consequence already reconstructs the witness.\n\nG6 must ensure that cheap affine/quotient consequences leave genuine residual ambiguity, then attack that residual before any positive interpretation with finite-domain CSP/SAT, local consistency, low-width dynamic programming, automorphism/normalization, equivalent-witness enumeration, and generated-role leakage tests.\n'''
          new_gate = '''The next controlled HGES experiment is **G7**, not a trapdoor construction. G6 showed that a cheap quotient may leave genuine ambiguity and still fail when the residual search dimension is constant.\n\nG7 must make every known cheap quotient leave residual dimension growing with the generated instance, then attack that growing residual with exact CSP/SAT, local consistency, low-width dynamic programming, automorphism/normalization, equivalent-witness enumeration, and generated-role leakage tests.\n'''
          if old_gate not in text:
              raise SystemExit('README G6 gate anchor missing')
          text = text.replace(old_gate, new_gate, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md docs/41-g6-affine-coset-residual.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G6: record affine-coset residual break'
          git push origin HEAD:g6/hges-affine-coset-residual
