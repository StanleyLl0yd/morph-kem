name: HGA4e held-out finite quotient control

on:
  pull_request:
    paths:
      - 'src/morph_kem/hga_hurwitz_heldout_quotient.py'
      - 'tests/test_hga_hurwitz_heldout_quotient.py'
      - 'scripts/hga_hurwitz_heldout_quotient_*.py'
      - '.github/workflows/hga4e.yml'
      - 'docs/81-hga4e-heldout-finite-quotient.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/hga_hurwitz_heldout_quotient.py'
      - 'tests/test_hga_hurwitz_heldout_quotient.py'
      - 'scripts/hga_hurwitz_heldout_quotient_*.py'
      - '.github/workflows/hga4e.yml'
      - 'docs/81-hga4e-heldout-finite-quotient.md'

permissions:
  contents: read

jobs:
  hga4e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile HGA4e
        run: >-
          python -m compileall -q
          src/morph_kem/hga_hurwitz_heldout_quotient.py
          tests/test_hga_hurwitz_heldout_quotient.py
          scripts/hga_hurwitz_heldout_quotient_baseline.py
          scripts/hga_hurwitz_heldout_quotient_sweep.py
      - name: HGA4e unit tests
        run: python -m unittest tests.test_hga_hurwitz_heldout_quotient -v
      - name: HGA4e fixed held-out baseline
        if: matrix.python-version == '3.12'
        run: python scripts/hga_hurwitz_heldout_quotient_baseline.py --params hga4e-D8
      - name: HGA4e multi-seed held-out sweep
        if: matrix.python-version == '3.12'
        run: python scripts/hga_hurwitz_heldout_quotient_sweep.py --seeds 8
