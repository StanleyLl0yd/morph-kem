name: G4 HGES coupled-phase parity negative control

on:
  pull_request:
    paths:
      - 'src/morph_kem/gluing_coupled.py'
      - 'tests/test_gluing_coupled.py'
      - 'scripts/gluing_coupled_*.py'
      - 'docs/05-cryptanalysis.md'
      - 'docs/39-g4-coupled-phase-parity.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/g4.yml'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/gluing_coupled.py'
      - 'tests/test_gluing_coupled.py'
      - 'scripts/gluing_coupled_*.py'
      - 'docs/05-cryptanalysis.md'
      - 'docs/39-g4-coupled-phase-parity.md'
      - 'notes/research-log.md'
      - 'README.md'
      - '.github/workflows/g4.yml'

permissions:
  contents: read

jobs:
  g4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile G4
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/morph_kem/gluing_coupled.py tests/test_gluing_coupled.py scripts/gluing_coupled_baseline.py scripts/gluing_coupled_sweep.py
      - name: G4 unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_gluing_coupled -v
      - name: G4 coupled-phase parity baseline
        env:
          PYTHONPATH: src
        run: python scripts/gluing_coupled_baseline.py --params g4-12
      - name: G4 multi-seed sweep
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: python scripts/gluing_coupled_sweep.py --seeds 8
