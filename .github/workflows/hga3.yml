name: HGA3 matrix-tuple intertwiner negative control

on:
  pull_request:
    paths:
      - 'src/morph_kem/hga_intertwiner.py'
      - 'tests/test_hga_intertwiner.py'
      - 'scripts/hga_intertwiner_*.py'
      - '.github/workflows/hga3.yml'
      - 'docs/65-hga3-matrix-tuple-intertwiner.md'
  push:
    branches: [main]
    paths:
      - 'src/morph_kem/hga_intertwiner.py'
      - 'tests/test_hga_intertwiner.py'
      - 'scripts/hga_intertwiner_*.py'
      - '.github/workflows/hga3.yml'
      - 'docs/65-hga3-matrix-tuple-intertwiner.md'

permissions:
  contents: read

jobs:
  hga3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile HGA3
        run: >-
          python -m compileall -q
          src/morph_kem/hga_intertwiner.py
          tests/test_hga_intertwiner.py
          scripts/hga_intertwiner_baseline.py
          scripts/hga_intertwiner_sweep.py
      - name: HGA3 unit tests
        run: python -m unittest tests.test_hga_intertwiner -v
      - name: HGA3 fixed baseline
        if: matrix.python-version == '3.12'
        run: python scripts/hga_intertwiner_baseline.py --params hga3-p11-n5
      - name: HGA3 multi-seed sweep
        if: matrix.python-version == '3.12'
        run: python scripts/hga_intertwiner_sweep.py --seeds 8
