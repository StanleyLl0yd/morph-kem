name: G19 one-shot measured-result bookkeeping

on:
  push:
    branches: ['g19/vertex-disjoint-cohomology-pair']
    paths: ['.github/workflows/g19-bookkeeping.yml']

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g19/vertex-disjoint-cohomology-pair
      - name: Record A-046 and G19 rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/05-cryptanalysis.md')
          text = ledger.read_text()
          anchor = '| A-045 | Public shortest odd-cocycle cycle + constrained exact-one-crossing connector | **Fatal to G18 generated distribution** | Implemented |'
          row = '| A-046 | Delete-one-cycle parity-cover recovery of bounded vertex-disjoint odd-cycle pair | **Fatal to G19 generated distribution** | Implemented |'
          if row not in text:
              if anchor not in text:
                  raise SystemExit('A-045 ledger anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          heading = '## A-046 — delete-one-cycle parity-cover recovery of bounded vertex-disjoint odd-cycle pair'
          if heading not in text:
              text = text.rstrip() + '''\n\n## A-046 — delete-one-cycle parity-cover recovery of bounded vertex-disjoint odd-cycle pair\n\n### Target\n\nG19 requires two vertex-disjoint simple primal cycles. Both must pair oddly with the same public nontrivial GF(2) cocycle, and their sorted lengths must fit generation-derived public bounds. This couples two simultaneously global geometric representatives rather than one cycle plus one connector.\n\n### Public attack\n\nA-046 first runs the public two-sheet cocycle parity-cover search on the full primal graph. For each short odd simple cycle candidate it deletes every vertex of that cycle and all incident edges, then repeats the parity-cover search on the remaining graph. Any second odd simple cycle is automatically vertex-disjoint from the first. Canonical pairs are submitted to the exact public verifier; reference data is consulted only after public success.\n\n### Fixed Python 3.12 `g19-8x9` result\n\n~~~text\nsuccessful carrier flips / generation retries: 72/0\npublic V/E/F:                                  72/216/144\npublic alpha weight / H1 dimension:            21/2\npublic short/long bounds:                       8/9\nreference short/long lengths:                   8/9\nreference seeded-tree attempts:                12\nfirst-stage roots / queue pops / edge scans:   72/9740/58574\nfirst-stage distinct candidates:               52\nfirst candidates attempted:                     1\nsecond-stage calls:                             1\nsecond-stage roots / reachable roots:          67/67\nsecond-stage queue pops / edge scans:          8232/43580\nsecond-stage candidates:                       44\nselected deleted vertices / edges:              5/41\nselected short/long lengths:                    5/6\nselected cocycle pairings / shared vertices:    1/1/0\nselected accepted:                             yes\nselected matches reference:                    no\n~~~\n\n### Deterministic sweep\n\nPython 3.12 tested `g19-6x6`, `g19-6x9`, `g19-8x9` over eight deterministic seeds each. All **24/24** carriers require zero generation retries. All **24/24** primary attacks accept the first first-stage candidate, make one second-stage call, recover pairings `1/1` with zero shared vertices, fit the public bounds and pass the exact verifier. Every selected pair is non-reference.\n\nMaximum selected lengths are `4/6`, `6/6`, and `6/7`; maximum second-stage edge scans are `9450`, `23146`, and `43485`.\n\nThe independent canonical spanning-tree fundamental-cycle cross-check is strictly weaker: it finds a bounded disjoint pair on only **4/24** measured instances (`1/8`, `3/8`, `0/8`). That incompleteness is preserved and is not used to support the rejection claim.\n\n### Result\n\n**G19 is rejected by A-046.** On this generated torus family, one short public odd cycle can be removed completely and the remaining graph still exposes a second bounded odd cycle through the same parity-cover machinery. Coupling two disjoint global representatives therefore does not create inversion hardness here.\n\nThis is a generated-distribution falsification, not a theorem about arbitrary disjoint noncontractible-cycle problems. Do not scale torus dimensions while the same delete-and-recover reduction remains effective. G20 must move beyond repeated parallel representatives on one handle. No security claim.\n'''
          ledger.write_text(text)

          log = Path('notes/research-log.md')
          text = log.read_text()
          log_heading = '## 2026-09-11 — G19 rejected by A-046'
          if log_heading not in text:
              text = text.rstrip() + '''\n\n## 2026-09-11 — G19 rejected by A-046\n\nG19 strengthened G18 by requiring two vertex-disjoint simple primal cycles, both odd against the same public nontrivial cocycle and both inside generation-derived sorted length bounds. Reference generation is independent and explicit; no measured carrier required a generation retry.\n\nA-046 breaks the measured family by repeated public parity-cover recovery. Find one short odd cycle, delete all its vertices and incident edges, then run the same odd-cycle recovery on the remaining graph. Fixed `g19-8x9` uses public bounds `8/9` but returns a `5/6` accepted non-reference pair after one first candidate and one second-stage call; the second stage scans 43,580 edges.\n\nAcross all three sizes × eight seeds, **24/24** primary attacks recover accepted bounded pairs with cocycle pairings `1/1`, zero shared vertices and non-reference identity. Maximum selected lengths are `4/6`, `6/6`, `6/7`; maximum second-stage scans are `9450`, `23146`, `43485`.\n\nThe independent canonical fundamental-cycle pair scan succeeds only 4/24 times. This weaker result is preserved separately and does not weaken the primary break.\n\n**G19 rejected by A-046.** G20 must prevent repeated recovery of parallel representatives on a single torus handle, likely by moving to multiple independent homology directions and a prescribed multicurve relation. No security claim.\n'''
              log.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('HGES controls G0–G18 are implemented and rejected.', 'HGES controls G0–G19 are implemented and rejected.')
          if '## G19 — vertex-disjoint cohomology-cycle pair control' not in text:
              marker = '\n## Research discipline\n'
              if marker not in text:
                  raise SystemExit('README research-discipline anchor missing')
              section = '''\n## G19 — vertex-disjoint cohomology-cycle pair control\n\nG19 requires two simultaneously global simple primal cycles: both must pair oddly with one public nontrivial cocycle, be vertex-disjoint, and fit generation-derived sorted length bounds.\n\n**G19 is rejected by A-046.** The public attack finds one short odd cycle with the parity-cover method, deletes all its vertices and incident edges, and repeats the same search on the remaining graph. Fixed `g19-8x9` has bounds `8/9` and yields an accepted non-reference `5/6` pair with zero shared vertices. Across all three sizes × eight seeds, **24/24** primary attacks succeed and all returned pairs are non-reference.\n\nA separate canonical fundamental-cycle pair scan succeeds on only 4/24 instances; that weaker cross-check is preserved but is not needed for rejection.\n\nSee `docs/54-g19-disjoint-cohomology-pair.md`.\n'''
              text = text.replace(marker, section + marker, 1)
          key_anchor = '- `docs/53-g18-length-bounded-cycle-pair.md` — measured G18/A-045 length-bounded geometric rejection'
          key_row = '- `docs/54-g19-disjoint-cohomology-pair.md` — measured G19/A-046 disjoint-cycle rejection'
          if key_row not in text:
              if key_anchor not in text:
                  raise SystemExit('README key-file anchor missing')
              text = text.replace(key_anchor, key_anchor + '\n' + key_row, 1)
          old = '''The next controlled HGES experiment is **G19**, not a trapdoor construction. G18 shows that adding exact geometric crossing and generation-derived length bounds is still insufficient: public parity-cover shortest paths plus a constrained dual connector recover accepted non-reference witnesses on every measured instance.\n\nG19 must couple multiple global representatives so that one shortest noncontractible cycle plus one connector is not enough—for example two internally vertex-disjoint representatives in a prescribed nontrivial class, or several cycles with pairwise geometric constraints. It must immediately face vertex-splitting max-flow, disjoint-path algorithms, matching, ILP/SAT/CP-SAT, separator/treewidth methods, shortest-cycle algorithms, normalization and equivalent-witness enumeration.\n\nNo trapdoor/KEM work begins before such a coupled geometric relation survives these attacks.\n'''
          new = '''The next controlled HGES experiment is **G20**, not a trapdoor construction. G19 shows that requiring two bounded vertex-disjoint global representatives in one torus class is still insufficient: public parity-cover recovery can find one representative, delete it, and recover another on every measured instance.\n\nG20 must prevent repeated recovery of parallel representatives on a single handle. The next useful control should expose multiple independent homology directions—for example a genus-two carrier with several cycles constrained to distinct public cohomology classes and a prescribed disjointness/intersection pattern. It must immediately face symplectic-basis algorithms, vertex-splitting/max-flow and disjoint-path reductions, matching, shortest-cycle methods, ILP/SAT/CP-SAT, separator/treewidth, normalization and equivalent-witness enumeration.\n\nNo trapdoor/KEM work begins before such a multicurve relation survives these attacks.\n'''
          if old not in text:
              raise SystemExit('README G19 next-gate block missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/05-cryptanalysis.md notes/research-log.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'G19: record A-046 disjoint-cycle rejection'
          git push origin HEAD:g19/vertex-disjoint-cohomology-pair
